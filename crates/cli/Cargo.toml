[package]
name = "iteron-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iteron"
path = "src/main.rs"

[dependencies]
iteron-protocol = { path = "../protocol" }
iteron-record = { path = "../record" }
iteron-obs = { path = "../obs" }
iteron-provider = { path = "../provider" }
iteron-tools = { path = "../tools" }
iteron-sched = { path = "../sched" }
iteron-workflow = { path = "../workflow" }
iteron-kernel = { path = "../kernel" }
iteron-ctx = { path = "../ctx" }
iteron-agents = { path = "../agents" }
iteron-evolve = { path = "../evolve" }
iteron-eval = { path = "../eval" }
iteron-mcp = { path = "../mcp" }
iteron-verify = { path = "../verify" }
iteron-sandbox = { path = "../sandbox" }
iteron-tunables = { path = "../tunables" }
iteron-changeset = { path = "../changeset" }
iteron-marketplace = { path = "../marketplace" }
iteron-statusline = { path = "../statusline" }
iteron-support = { path = "../support" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
async-trait = "0.1"
url = "2"
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
libc = "0.2"
base64 = { workspace = true }
png = { workspace = true }
gif = { workspace = true }
image-webp = { workspace = true }
zune-jpeg = { workspace = true }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
# Tests pin a registry-driven resolved tunable set rather than inventing a snapshot.
iteron-record = { path = "../record", features = ["test-fixtures"] }
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
tokio = { workspace = true, features = ["test-util"] }
