[package]
name = "core-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
core-protocol = { path = "../protocol" }
core-record = { path = "../record" }
core-obs = { path = "../obs" }
core-provider = { path = "../provider" }
core-tools = { path = "../tools" }
core-sched = { path = "../sched" }
core-workflow = { path = "../workflow" }
core-kernel = { path = "../kernel" }
core-ctx = { path = "../ctx" }
core-agents = { path = "../agents" }
core-evolve = { path = "../evolve" }
core-eval = { path = "../eval" }
core-mcp = { path = "../mcp" }
core-verify = { path = "../verify" }
core-sandbox = { path = "../sandbox" }
core-tunables = { path = "../tunables" }
core-changeset = { path = "../changeset" }
core-marketplace = { path = "../marketplace" }
core-statusline = { path = "../statusline" }
core-support = { path = "../support" }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
async-trait = "0.1"
url = "2"
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
libc = "0.2"
base64 = { workspace = true }
png = { workspace = true }
gif = { workspace = true }
image-webp = { workspace = true }
zune-jpeg = { workspace = true }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.15.2"
tokio = { workspace = true, features = ["test-util"] }
