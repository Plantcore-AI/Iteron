[package]
name = "iteron-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The ultracode-workflow engine: embeds QuickJS (via rquickjs) so Claude Code's `.js` workflow
# scripts run with `agent()/parallel()/pipeline()/phase()/log()`. It stays OFF `iteron-kernel`:
# the real sub-agent spawn is a trait (`AgentSpawner`) the kernel/CLI implements, so the dependency
# edge points into this crate, never out of it (WORKFLOW-REPLICATION-DESIGN.md §2.1).

[dependencies]
iteron-protocol = { path = "../protocol" }
iteron-sched = { path = "../sched" }
# QuickJS embed — the PROVEN spike pattern (features ["futures","macro"]): AsyncRuntime + LocalSet +
# spawn_local(rt.drive()); inline `Async(async_fn)` host fns; eval -> Promise -> into_future.
rquickjs = { version = "0.12", features = ["futures", "macro"] }
tokio = { workspace = true }
# CancellationToken threaded into every AgentCall + the rquickjs interrupt handler (design B3).
tokio-util = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
# Schema-forced structured output (design §2.5): JSON Schema draft 2020-12 validation.
# default-features off keeps it lean/offline — we only validate local, in-memory schemas.
jsonschema = { version = "0.49", default-features = false }
# Content-addressed resume cache key: v2:sha256 over the canonical agent input (design §2.6).
sha2 = { workspace = true }
hex = { workspace = true }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
