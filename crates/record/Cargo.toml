[package]
name = "iteron-record"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `resolved_fixture` so other crates' tests can pin a registry-driven resolved set.
test-fixtures = ["iteron-tunables/test-fixtures"]

[dependencies]
iteron-protocol = { path = "../protocol" }
iteron-obs = { path = "../obs" }
iteron-tunables = { path = "../tunables" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
iteron-tunables = { path = "../tunables", features = ["test-fixtures"] }

# Unix file-open protection (O_NOFOLLOW), ownership checks, and test error codes.
# Ordinary standalone appends acknowledge OS writes; Done synchronizes the journal.
# See docs/spec/standalone-persistence.md for the persistence and power-loss contract.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
