[package]
name = "iteron-evolve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "evolve-transcript"
path = "src/main.rs"

# The evolution control plane is deliberately outside the runtime TCB. It consumes recorded
# trajectories and emits versioned policy artifacts; it cannot execute tools or grant capability.
[dependencies]
iteron-protocol = { path = "../protocol" }
iteron-record = { path = "../record" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
