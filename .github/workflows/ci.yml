name: ci
# These lanes no longer run automatically. They need no GitHub-hosted runner, so they run on
# hardware we already own and publish the same status contexts from there:
#
#   rust / macos-15      developer Mac, pre-push
#   rust / ubuntu-24.04  DGX box
#   boundary / validate  DGX box
#   supply / validate    DGX box
#   docs / strict-build  DGX box  (see docs.yml)
#
# all via `release-tools/local_gate.sh <macos|linux>`. A branch ruleset matches a required check
# by context NAME, not by producer, so the protection is unchanged. What changes is that a status
# is now executor-attested rather than machine-enforced, and a pull request nobody gates stays
# blocked; both are documented in CONTRIBUTING.md.
#
# `review / required-humans` stays on Actions because it reads the pull request's own review
# state, which has no local equivalent. So does `windows / check` (see `windows.yml`): Windows is
# the one platform we cannot self-host. That lane is NON-BLOCKING and reports compilation only —
# there is no Windows sandbox backend, no Windows release target, and no Windows support. Its
# tracking issues are closed with nothing delivered, so the lane exists to keep the gap visible.
#
# This workflow is kept, in full, behind manual dispatch: it is the fallback when Actions
# capacity is available again and the reference definition these local lanes mirror.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.90.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply:
    name: supply / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: validate installer, release helpers, and workflows
        run: release-tools/validate.sh

  dependency-audit:
    name: supply / dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: audit locked dependencies against the pinned RustSec database
        run: release-tools/audit_dependencies.sh linux-x86_64

  boundary:
    name: boundary / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: enforce the complete microkernel conformance matrix
        run: cargo run --locked -p iteron-xtask -- conformance kernel
      # The CLI reference is generated from the argument parser. A shipped flag with no doc entry
      # (the permission bypass was one) is a red build, not a documentation backlog item.
      - name: enforce the generated CLI reference
        run: cargo run --locked -p iteron-xtask -- docs check
      - name: verify captured client runtime evidence on main
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse --verify 'HEAD^1^{commit}')
          arguments=(
            verify-evidence
            --root "$GITHUB_WORKSPACE"
            --trusted-commit "$source_commit"
            --require-attestation
          )
          builder_commit=$(jq -er '
            if .runtime_builder == null then
              ""
            else
              .runtime_builder.commit
            end
          ' governance/client-conformance.json)
          if [[ -n "$builder_commit" ]]; then
            arguments+=(--trusted-builder-commit "$builder_commit")
          fi
          python3 -I release-tools/client_runtime_receipt.py "${arguments[@]}"
      - name: validate ownership and dependency contract on main
        if: github.event_name == 'push'
        run: cargo run --locked -p iteron-xtask -- boundaries check
      - name: materialize trusted base policy
        id: policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            diff_base_sha=$PR_BASE_SHA
            policy_sha=$PR_BASE_SHA
          else
            test "$EVENT_NAME" = merge_group
            diff_base_sha=$MERGE_GROUP_BASE_SHA
            policy_ref=$MERGE_GROUP_BASE_REF
            [[ "$policy_ref" == refs/heads/* ]]
            git check-ref-format "$policy_ref"
            policy_tracking_ref=refs/remotes/origin/core-policy-base
            git fetch --no-tags origin "+$policy_ref:$policy_tracking_ref"
            policy_sha=$(git rev-parse "$policy_tracking_ref^{commit}")
          fi

          [[ "$diff_base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$policy_sha" =~ ^[0-9a-f]{40}$ ]]
          candidate_sha=$(git rev-parse 'HEAD^{commit}')
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$policy_sha" "$diff_base_sha"
          git merge-base --is-ancestor "$diff_base_sha" "$candidate_sha"
          git worktree add --detach "$POLICY_ROOT" "$policy_sha"
          {
            echo "diff-base-sha=$diff_base_sha"
            echo "policy-sha=$policy_sha"
          } >> "$GITHUB_OUTPUT"
      - name: materialize one-time trusted-policy compatibility projection
        id: compatibility
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          LEGACY_POLICY_ANCHOR_SHA: 6b850ca79b3a167a25357f873841e2bedcbad59a
          LEGACY_PARSER_BLOB_OID: 1758a24e092648a71469f3e3cfbac45a9cb204b7
          COMPATIBILITY_POLICY_SHA: 2c17775f7df54581eebee3fe49b00d5d0db16fe9
          POLICY_SHA: ${{ steps.policy.outputs.policy-sha }}
          PROJECTION_ROOT: ${{ runner.temp }}/core-policy-candidate-projection
          COMPATIBILITY_POLICY_ROOT: ${{ runner.temp }}/core-policy-compatibility
        run: |
          set -euo pipefail
          candidate_root=$GITHUB_WORKSPACE
          compatibility_active=false
          legacy_parser=xtask/src/schema_compat_rust_cli_parse.rs

          test "$(git cat-file -t "$LEGACY_POLICY_ANCHOR_SHA")" = commit
          read -r anchor_mode anchor_type anchor_oid anchor_path \
            <<<"$(git ls-tree "$LEGACY_POLICY_ANCHOR_SHA" -- "$legacy_parser")"
          test "$anchor_mode" = 100644
          test "$anchor_type" = blob
          test "$anchor_oid" = "$LEGACY_PARSER_BLOB_OID"
          test "$anchor_path" = "$legacy_parser"

          if git merge-base --is-ancestor \
            "$LEGACY_POLICY_ANCHOR_SHA" "$POLICY_SHA"; then
            read -r parser_mode parser_type parser_oid parser_path \
              <<<"$(git ls-tree "$POLICY_SHA" -- "$legacy_parser")"
          fi

          if [[ "${parser_mode:-}" == 100644 \
            && "${parser_type:-}" == blob \
            && "${parser_oid:-}" == "$LEGACY_PARSER_BLOB_OID" \
            && "${parser_path:-}" == "$legacy_parser" ]]; then
            candidate_sha=$(git rev-parse --verify 'HEAD^{commit}')
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$(git cat-file -t "$COMPATIBILITY_POLICY_SHA")" = commit
            git merge-base --is-ancestor \
              "$LEGACY_POLICY_ANCHOR_SHA" "$COMPATIBILITY_POLICY_SHA"
            git merge-base --is-ancestor \
              "$COMPATIBILITY_POLICY_SHA" "$candidate_sha"

            for pinned_path in \
              governance/client-conformance.json \
              governance/schema-compatibility.json \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl \
              crates/eval/src/contract.rs \
              crates/cli/src/main.rs \
              crates/cli/src/output.rs
            do
              read -r candidate_mode candidate_type candidate_oid candidate_path \
                <<<"$(git ls-tree "$candidate_sha" -- "$pinned_path")"
              read -r policy_mode policy_type policy_oid policy_path \
                <<<"$(git ls-tree "$COMPATIBILITY_POLICY_SHA" -- "$pinned_path")"
              test "$candidate_mode" = 100644
              test "$candidate_type" = blob
              [[ "$candidate_oid" =~ ^[0-9a-f]{40}$ ]]
              test "$candidate_path" = "$pinned_path"
              test "$policy_mode" = 100644
              test "$policy_type" = blob
              [[ "$policy_oid" =~ ^[0-9a-f]{40}$ ]]
              test "$policy_oid" = "$candidate_oid"
              test "$policy_path" = "$pinned_path"
            done

            test ! -e "$PROJECTION_ROOT"
            test ! -e "$COMPATIBILITY_POLICY_ROOT"
            git worktree add --detach "$PROJECTION_ROOT" "$candidate_sha"
            git worktree add --detach \
              "$COMPATIBILITY_POLICY_ROOT" "$COMPATIBILITY_POLICY_SHA"
            test -z "$(git -C "$PROJECTION_ROOT" status --porcelain=v1 \
              --untracked-files=all)"

            manifest=$PROJECTION_ROOT/governance/schema-compatibility.json
            projected_manifest=$PROJECTION_ROOT/governance/.schema-compatibility.projected.json
            test ! -L "$manifest"
            test ! -e "$projected_manifest"
            test ! -L "$projected_manifest"
            test "$(jq '
              [.surfaces[]
                | select(.id == "cli.machine-stream.input-attachment")]
              | length
            ' "$manifest")" = 1
            jq '
              .surfaces |= map(
                select(.id != "cli.machine-stream.input-attachment")
              )
            ' "$manifest" > "$projected_manifest"
            mv "$projected_manifest" "$manifest"
            test "$(jq '
              [.surfaces[]
                | select(.id == "cli.machine-stream.input-attachment")]
              | length
            ' "$manifest")" = 0

            git -C "$PROJECTION_ROOT" rm --quiet -- \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl
            git -C "$PROJECTION_ROOT" checkout "$POLICY_SHA" -- \
              crates/cli/src/main.rs crates/eval/src/contract.rs

            projected_paths=$RUNNER_TEMP/core-policy-projected-paths
            test ! -e "$projected_paths"
            git -C "$PROJECTION_ROOT" diff --name-only HEAD -- > "$projected_paths"
            diff -u <(printf '%s\n' \
              crates/cli/src/main.rs \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl \
              crates/eval/src/contract.rs \
              governance/schema-compatibility.json) "$projected_paths"
            test -z "$(git -C "$PROJECTION_ROOT" status --porcelain=v1 \
              --untracked-files=all | grep '^??' || true)"

            candidate_root=$PROJECTION_ROOT
            compatibility_active=true
          fi

          {
            echo "active=$compatibility_active"
            echo "candidate-root=$candidate_root"
          } >> "$GITHUB_OUTPUT"
      - name: build trusted base validator
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        working-directory: ${{ runner.temp }}/core-policy-base
        run: cargo build --locked -p iteron-xtask
      - name: verify captured client runtime evidence with trusted base policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          COMPATIBILITY_POLICY_SHA: 2c17775f7df54581eebee3fe49b00d5d0db16fe9
          GH_TOKEN: ${{ github.token }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_SHA: ${{ steps.policy.outputs.policy-sha }}
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          verifier=$POLICY_ROOT/release-tools/client_runtime_receipt.py
          if [[ ! -e "$verifier" ]]; then
            test ! -L "$verifier"
            candidate_sha=$(git rev-parse --verify 'HEAD^{commit}')
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$(git cat-file -t "$COMPATIBILITY_POLICY_SHA")" = commit
            git merge-base --is-ancestor \
              "$COMPATIBILITY_POLICY_SHA" "$candidate_sha"

            manifest=governance/client-conformance.json
            read -r candidate_mode candidate_type candidate_oid candidate_path \
              <<<"$(git ls-tree "$candidate_sha" -- "$manifest")"
            read -r policy_mode policy_type policy_oid policy_path \
              <<<"$(git ls-tree "$COMPATIBILITY_POLICY_SHA" -- "$manifest")"
            test "$candidate_mode" = 100644
            test "$candidate_type" = blob
            [[ "$candidate_oid" =~ ^[0-9a-f]{40}$ ]]
            test "$candidate_path" = "$manifest"
            test "$policy_mode" = 100644
            test "$policy_type" = blob
            test "$policy_oid" = "$candidate_oid"
            test "$policy_path" = "$manifest"
            test "$(git cat-file -s "$candidate_oid")" -le 65536
            test -x "$POLICY_BIN"
            test ! -L "$POLICY_BIN"
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check
            jq -e '
              .schema_version == 2
              and .runtime_builder == null
              and .runtime_receipt == null
              and .version_independence.status == "pending"
              and (.platform_smoke | length == 5)
              and ([.platform_smoke[].status] | all(. == "pending"))
            ' < <(git cat-file blob "$candidate_oid") >/dev/null
            evidence_paths=$RUNNER_TEMP/core-runtime-bootstrap-evidence-paths
            test ! -e "$evidence_paths"
            git -C "$GITHUB_WORKSPACE" ls-tree -r -z "$candidate_sha" -- \
              governance/client-conformance/runtime > "$evidence_paths"
            test ! -s "$evidence_paths"
            printf 'one-time null/pending client runtime receipt bootstrap validated\n'
            exit 0
          fi
          test -f "$verifier"
          test ! -L "$verifier"
          arguments=(
            verify-evidence
            --root "$GITHUB_WORKSPACE"
            --trusted-commit "$POLICY_SHA"
            --require-attestation
          )
          builder_commit=$(jq -er '
            if .runtime_builder == null then
              ""
            else
              .runtime_builder.commit
            end
          ' "$POLICY_ROOT/governance/client-conformance.json")
          if [[ -n "$builder_commit" ]]; then
            arguments+=(--trusted-builder-commit "$builder_commit")
          fi
          python3 -I "$verifier" "${arguments[@]}"
      - name: validate candidate against published schema chronology
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          if [[ ! -f "$POLICY_ROOT/release-tools/schema_release.py" ]]; then
            printf 'published schema chronology activates after the bootstrap policy lands\n'
            exit 0
          fi

          api_version=2026-03-10
          pages=$RUNNER_TEMP/core-schema-release-pages.jsonl
          releases=$RUNNER_TEMP/core-schema-releases.json
          : > "$pages"
          for page in $(seq 1 11); do
            page_json=$RUNNER_TEMP/core-schema-release-page-$page.json
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
              --jq '[.[] | {tag_name, draft, prerelease, immutable}]' \
              > "$page_json"
            jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
            count=$(jq -r 'length' "$page_json")
            if [[ "$page" -eq 11 ]]; then
              if [[ "$count" -ne 0 ]]; then
                printf 'published release inventory exceeds the 1,000-release limit\n' >&2
                exit 1
              fi
              break
            fi
            jq -c '.' "$page_json" >> "$pages"
            [[ "$count" -eq 100 ]] || break
          done
          jq -s '.' "$pages" > "$releases"

          previous=$(python3 "$POLICY_ROOT/release-tools/schema_release.py" \
            --input "$releases" --latest)
          if [[ "$previous" == BOOTSTRAP ]]; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              schema-compat check-bootstrap
            exit 0
          fi

          [[ "$previous" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$previous")" = tag
          previous_commit=$(git rev-parse "refs/tags/$previous^{commit}")
          candidate_commit=$(git rev-parse HEAD)
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$previous_commit" "$candidate_commit"
          gh release verify "$previous" --repo "$GITHUB_REPOSITORY"
          if git diff --quiet \
            "$previous_commit" "$candidate_commit" \
            -- governance/schema-compatibility.json; then
            printf 'schema contract is unchanged from published release %s\n' "$previous"
            exit 0
          fi

          release_policy_root=$RUNNER_TEMP/core-schema-published-policy
          release_policy_target=$RUNNER_TEMP/core-schema-published-target
          git worktree add --detach "$release_policy_root" "$previous_commit"
          (
            cd "$release_policy_root"
            CARGO_TARGET_DIR="$release_policy_target" \
              cargo build --locked -p iteron-xtask
          )
          "$release_policy_target/debug/iteron-xtask" \
            --repo "$CANDIDATE_ROOT" \
            schema-compat check-release --base "$previous_commit"
      - name: validate candidate against its immediate trusted base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          DIFF_BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          check='iteron-xtask boundaries check-base --base <rev>'
          if jq -e --arg check "$check" '
            .boundaries[]
            | select(.id == "protocol-compat")
            | .checks
            | index($check) != null
          ' "$POLICY_ROOT/governance/boundaries.json" >/dev/null; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              boundaries check-base --base "$DIFF_BASE_SHA"
          elif [[ -f "$POLICY_ROOT/governance/schema-compatibility.json" ]]; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              schema-compat check-base --base "$DIFF_BASE_SHA"
          else
            printf 'one-time schema compatibility bootstrap; no trusted contract exists yet\n'
          fi
      - name: validate candidate with trusted base policy
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check'
      - name: summarize pull request boundary impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries affected --base "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"'
      - name: validate pull request responsibility contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          PR_BODY: ${{ github.event.pull_request.body }}
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check-pr --base "$BASE_SHA"'
      - name: build one-time compatibility validator
        if: steps.compatibility.outputs.active == 'true'
        working-directory: ${{ runner.temp }}/core-policy-compatibility
        run: cargo build --locked -p iteron-xtask
      - name: validate real candidate with one-time compatibility policy
        if: steps.compatibility.outputs.active == 'true'
        env:
          COMPATIBILITY_POLICY_BIN: ${{ runner.temp }}/core-policy-compatibility/target/debug/iteron-xtask
        run: >-
          "$COMPATIBILITY_POLICY_BIN" --repo "$GITHUB_WORKSPACE"
          boundaries check

  test:
    name: rust / ${{ matrix.os }}
    strategy:
      matrix:
        # windows-2025 is NON-GATING on purpose (#38): the branch ruleset requires
        # `rust / ubuntu-24.04` and `rust / macos-15` by name, so adding a third context cannot
        # block a merge until someone decides it should. It exists so Windows breakage is visible
        # instead of being discovered at release time -- `release.yml` skips the full suite on
        # that target and runs a single test.
        include:
          - os: ubuntu-24.04
            advisory: false
          - os: macos-15
            advisory: false
          # Advisory until #38's follow-up lands. Windows has never compiled here, and the
          # POSIX surface the suite still assumes is large: 9 files reach for /bin/bash, 3 for
          # /bin/sh, 34 touch symlinks, 8 hardcode /tmp, and 12 golden fixtures are compared
          # byte-for-byte with no .gitattributes pinning LF. Reporting that list every run is
          # worth having now; blocking on it before it is fixed is not.
          - os: windows-2025
            advisory: true
      fail-fast: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    # Windows is the slowest of the three; a cold cargo build there does not fit in 30.
    timeout-minutes: 50
    defaults:
      run:
        # Windows runners default to PowerShell, where `$RUSTUP_TOOLCHAIN` is a PowerShell
        # variable rather than the environment one (that is `$env:`). It expanded to the empty
        # string and rustup died with `invalid toolchain name: ''` before compiling anything.
        # Pinning bash for the whole job keeps one set of commands across all three runners
        # instead of forking the syntax per OS.
        shell: bash
    steps:
      # `cargo test --workspace` runs the xtask conformance suite, and
      # `current_tcb_snapshot_matches_the_w1_freeze` resolves the W1 freeze commit through git.
      # A shallow checkout does not contain that commit, so the whole matrix fails on
      # `cannot resolve compatibility base revision`. The boundary job fetches full history for
      # the same reason.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install pinned Rust toolchain
        shell: bash
        run: >-
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          --component clippy --component rustfmt
      # Ubuntu 24.04 restricts unprivileged user namespaces unless the invoking program has an
      # explicit AppArmor profile. Install bwrap, attach permission only to its fixed system path,
      # and let the live test fail if the namespace boundary still cannot be created.
      - name: install and authorize bubblewrap boundary (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: format
        shell: bash
        run: cargo fmt --all -- --check
      - name: check
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo check --locked -p iteron-cli --all-targets
          else
            cargo check --workspace --all-targets --locked
          fi
      - name: build the explicit windows-msvc client target
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --locked --target x86_64-pc-windows-msvc -p iteron-cli
      - name: clippy (deny warnings)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo clippy --locked -p iteron-cli --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets --locked -- -D warnings
          fi
      - name: test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo test --locked -p iteron-cli --test windows_conpty
            cargo test --locked -p iteron-cli --test headless_serve \
              no_tty_skew_reconnect_and_result_v5_share_one_headless_server -- --exact
            cargo test --locked -p iteron-cli --test one_shot_output \
              text_one_shot_process_contract_is_byte_exact -- --exact
            cargo test --locked -p iteron-cli
          else
            cargo test --workspace --all-targets --locked
          fi

  # Non-blocking by construction (`continue-on-error`). The suite has 1613 functional tests and
  # not one wall-clock bound, so a one-line concurrency hazard — a lock held across an await, an
  # fsync moved into a loop — merges green (I-57). This replays a fixed script against the
  # loopback fixture provider and asserts a loose ceiling on `kernel_tax`, the harness's own
  # admission/broker/fsync microseconds, so the provider contributes nothing to the number. The
  # budget sits at 1.75x an observed min-of-5 floor: a 2x regression fails it, ordinary variance
  # does not. `ITERON_HARNESS_TAX_BUDGET_US` re-bases it if this runner is simply slower.
  harness-latency:
    name: perf / harness latency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # `--ignored` is the whole gate: the merge lane never spends wall-clock time on timing, and
      # this job never blocks a merge on a runner having a bad minute.
      - name: harness-attributable latency budget
        run: >-
          cargo test --locked -p iteron-cli --test harness_latency --
          --ignored --nocapture

  evolution-gate:
    name: gate / evolution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The evolution rows cite tests in crates/agents and crates/cli as well as crates/evolve, and
      # the row validator resolves every citation against the checkout. It reads files, not git
      # history, so a shallow checkout is sufficient here.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # Fails on any row that names no plane placement, cites a test that does not exist, names a
      # world module that is not on disk, or leaves a proven module or algebra operator unclaimed.
      # There is no target-only state to suppress: an unbacked row is a red gate.
      - name: evolution conformance rows
        run: cargo run --locked -p iteron-evolve --bin evolve-transcript -- gate rows --repo .
      # Runs the offline transcript twice under each producer order, verifies both hash chains,
      # replays each promotion journal, exercises the checkpoint algebra, and proves the evaluator
      # and promotion roles are not interchangeable. Non-zero exit means a module is unproven.
      - name: evolution-proven gate artifact
        run: >-
          cargo run --locked -p iteron-evolve --bin evolve-transcript -- gate prove --repo .
          --scratch "$RUNNER_TEMP/evolution-gate"
      # The gate's own determinism and no-overclaim assertions. Kept separate from the binary run so
      # a report that passes for the wrong reason still turns this job red.
      - name: evolution gate assertions
        run: cargo test --locked -p iteron-evolve --all-targets

  release-build:
    name: release build / ${{ matrix.os }}
    if: github.event_name == 'push'
    needs: [boundary, dependency-audit, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: build release
        shell: bash
        run: cargo build --release -p iteron-cli --locked
      # This main-branch smoke build never distributes a naked binary. Only the
      # protected tag workflow packages licenses, notices, SBOMs, and provenance.
