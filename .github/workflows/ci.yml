name: ci
# The protected base workflow is the only pull-request CI entry point. It classifies the diff,
# fans out only the required Linux lanes, and runs them on the repository-scoped DGX Spark.
# `pull_request_target` is intentional: an external fork cannot replace this workflow before the
# trusted-base guard refuses execution. Persistent self-hosted runners never execute fork code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Validation depth for a trusted manual run
        required: true
        type: choice
        default: full
        options: [full, docs, dependencies, infrastructure]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  GH_CLI_LINUX_ARM64_SHA256: 73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5
  GH_CLI_VERSION: 2.97.0
  RUSTUP_TOOLCHAIN: 1.90.0

concurrency:
  group: >-
    ci-${{ github.event.pull_request.number || github.ref }}-${{
      github.event_name == 'pull_request_review' && 'review' || 'validation'
    }}
  cancel-in-progress: true

jobs:
  route:
    name: ci / route
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 5
    outputs:
      audit: ${{ steps.classify.outputs.audit }}
      boundary: ${{ steps.classify.outputs.boundary }}
      change_class: ${{ steps.classify.outputs.change_class }}
      dependency_check: ${{ steps.classify.outputs.dependency_check }}
      docs: ${{ steps.classify.outputs.docs }}
      evolution: ${{ steps.classify.outputs.evolution }}
      perf: ${{ steps.classify.outputs.perf }}
      release_build: ${{ steps.classify.outputs.release_build }}
      rust: ${{ steps.classify.outputs.rust }}
      supply: ${{ steps.classify.outputs.supply }}
    steps:
      - name: check out trusted base router
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: classify trusted change
        id: classify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("node:path");
            const {classify} = require(
              path.join(process.env.GITHUB_WORKSPACE, "release-tools/ci_route.js")
            );
            const event = context.eventName;
            const pr = context.payload.pull_request;
            const manual = context.payload.inputs?.profile;

            if (pr && pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed(
                "External fork code is not permitted on the persistent DGX runner. " +
                "A maintainer must provision an isolated ephemeral runner first."
              );
              return;
            }

            let files = [];
            let filesKnown = true;
            if (pr) {
              const rows = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              files = rows.map((row) => row.filename);
            } else if (event === "push") {
              const before = context.payload.before;
              const after = context.payload.after;
              try {
                if (
                  !/^[0-9a-f]{40}$/.test(before || "") ||
                  !/^[0-9a-f]{40}$/.test(after || "") ||
                  /^0{40}$/.test(before)
                ) {
                  throw new Error("push payload has no comparable parent commit");
                }
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${before}...${after}`,
                  per_page: 100,
                });
                const comparedFiles = comparison.data.files;
                if (!Array.isArray(comparedFiles) || comparedFiles.length >= 300) {
                  throw new Error("comparison file list is absent or reached the API cap");
                }
                files = comparedFiles.map((row) => row.filename);
              } catch (error) {
                filesKnown = false;
                core.warning(`Could not classify the main push; running full CI: ${error.message}`);
              }
            }
            const actor = pr?.user?.login || context.actor;
            const outputs = classify({
              event,
              files,
              filesKnown,
              actor,
              draft: Boolean(pr?.draft),
              manual,
            });
            const changeClass = outputs.change_class;
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, String(value));
            }
            await core.summary
              .addHeading("CI routing")
              .addTable([
                [{data: "Class", header: true}, {data: changeClass, header: false}],
                [{data: "Changed files", header: true}, {data: String(files.length), header: false}],
                [{data: "Linux lanes", header: true}, {
                  data: Object.entries(outputs)
                    .filter(([name, value]) => name !== "change_class" && value === true)
                    .map(([name]) => name)
                    .join(", ") || "review only",
                  header: false,
                }],
              ])
              .write();

  supply:
    name: supply / validate
    needs: route
    if: needs.route.outputs.supply == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: validate installer, release helpers, and workflows
        run: release-tools/validate.sh

  dependency-audit:
    name: supply / dependency audit
    needs: route
    if: needs.route.outputs.audit == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: audit locked dependencies against the pinned RustSec database
        run: release-tools/audit_dependencies.sh

  dependency-check:
    name: rust / dependency-check
    needs: route
    if: needs.route.outputs.dependency_check == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: isolate the persistent Cargo cache by runner
        run: |
          [[ "$RUNNER_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          printf 'CARGO_TARGET_DIR=/var/tmp/iteron-ci-target/%s\n' \
            "$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: check grouped dependency update on Linux
        run: cargo check --workspace --all-targets --locked

  boundary:
    name: boundary / validate
    needs: route
    if: needs.route.outputs.boundary == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: install pinned GitHub CLI with release-attestation support
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "$RUNNER_TEMP/iteron-gh-cli.XXXXXX")
          archive=$tool_root/gh.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$GH_CLI_LINUX_ARM64_SHA256" "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$tool_root"
          gh_root=$tool_root/gh_${GH_CLI_VERSION}_linux_arm64
          test -x "$gh_root/bin/gh"
          "$gh_root/bin/gh" release verify --help >/dev/null
          echo "$gh_root/bin" >> "$GITHUB_PATH"
      - name: enforce the complete microkernel conformance matrix
        run: cargo run --locked -p iteron-xtask -- conformance kernel
      # The CLI reference is generated from the argument parser. A shipped flag with no doc entry
      # (the permission bypass was one) is a red build, not a documentation backlog item.
      - name: enforce the generated CLI reference
        run: cargo run --locked -p iteron-xtask -- docs check
      - name: enforce the tier-2 parameter catalog against the source declarations
        # The catalog is generated, so it can go stale on any branch that adds or renames a
        # constant. Regenerating is one command; discovering the drift months later is not.
        run: cargo run --locked -p iteron-xtask -- tunables check-params
      - name: enforce the whole optimization surface and its totality
        # Asserts the module axis stays total and no module empties out, and that the export does
        # not claim a surface the profile loader would refuse.
        run: cargo run --locked -p iteron-xtask -- tunables surface
      - name: enforce the constants census baseline
        run: cargo run --locked -p iteron-xtask -- tunables census-check
      - name: verify captured client runtime evidence on main
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse --verify 'HEAD^1^{commit}')
          arguments=(
            verify-evidence
            --root "$GITHUB_WORKSPACE"
            --trusted-commit "$source_commit"
            --require-attestation
          )
          builder_commit=$(jq -er '
            if .runtime_builder == null then
              ""
            else
              .runtime_builder.commit
            end
          ' governance/client-conformance.json)
          if [[ -n "$builder_commit" ]]; then
            arguments+=(--trusted-builder-commit "$builder_commit")
          fi
          python3 -I release-tools/client_runtime_receipt.py "${arguments[@]}"
      - name: validate ownership and dependency contract on main
        if: github.event_name == 'push'
        run: cargo run --locked -p iteron-xtask -- boundaries check
      - name: materialize trusted base policy
        id: policy
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            diff_base_sha=$PR_BASE_SHA
            policy_sha=$PR_BASE_SHA
          else
            test "$EVENT_NAME" = merge_group
            diff_base_sha=$MERGE_GROUP_BASE_SHA
            policy_ref=$MERGE_GROUP_BASE_REF
            [[ "$policy_ref" == refs/heads/* ]]
            git check-ref-format "$policy_ref"
            policy_tracking_ref=refs/remotes/origin/core-policy-base
            git fetch --no-tags origin "+$policy_ref:$policy_tracking_ref"
            policy_sha=$(git rev-parse "$policy_tracking_ref^{commit}")
          fi

          [[ "$diff_base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$policy_sha" =~ ^[0-9a-f]{40}$ ]]
          candidate_sha=$(git rev-parse 'HEAD^{commit}')
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$policy_sha" "$diff_base_sha"
          git merge-base --is-ancestor "$diff_base_sha" "$candidate_sha"
          # This repository uses a persistent runner. Actions removes RUNNER_TEMP between jobs,
          # but Git keeps the vanished auxiliary worktree registered in the checkout metadata.
          git worktree prune --expire now
          git worktree add --detach "$POLICY_ROOT" "$policy_sha"
          {
            echo "diff-base-sha=$diff_base_sha"
            echo "policy-sha=$policy_sha"
          } >> "$GITHUB_OUTPUT"
      - name: materialize one-time trusted-policy compatibility projection
        id: compatibility
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        shell: bash
        env:
          LEGACY_POLICY_ANCHOR_SHA: 6b850ca79b3a167a25357f873841e2bedcbad59a
          LEGACY_PARSER_BLOB_OID: 1758a24e092648a71469f3e3cfbac45a9cb204b7
          COMPATIBILITY_POLICY_SHA: 2c17775f7df54581eebee3fe49b00d5d0db16fe9
          POLICY_SHA: ${{ steps.policy.outputs.policy-sha }}
          PROJECTION_ROOT: ${{ runner.temp }}/core-policy-candidate-projection
          COMPATIBILITY_POLICY_ROOT: ${{ runner.temp }}/core-policy-compatibility
        run: |
          set -euo pipefail
          candidate_root=$GITHUB_WORKSPACE
          compatibility_active=false
          legacy_parser=xtask/src/schema_compat_rust_cli_parse.rs

          test "$(git cat-file -t "$LEGACY_POLICY_ANCHOR_SHA")" = commit
          read -r anchor_mode anchor_type anchor_oid anchor_path \
            <<<"$(git ls-tree "$LEGACY_POLICY_ANCHOR_SHA" -- "$legacy_parser")"
          test "$anchor_mode" = 100644
          test "$anchor_type" = blob
          test "$anchor_oid" = "$LEGACY_PARSER_BLOB_OID"
          test "$anchor_path" = "$legacy_parser"

          if git merge-base --is-ancestor \
            "$LEGACY_POLICY_ANCHOR_SHA" "$POLICY_SHA"; then
            read -r parser_mode parser_type parser_oid parser_path \
              <<<"$(git ls-tree "$POLICY_SHA" -- "$legacy_parser")"
          fi

          if [[ "${parser_mode:-}" == 100644 \
            && "${parser_type:-}" == blob \
            && "${parser_oid:-}" == "$LEGACY_PARSER_BLOB_OID" \
            && "${parser_path:-}" == "$legacy_parser" ]]; then
            candidate_sha=$(git rev-parse --verify 'HEAD^{commit}')
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$(git cat-file -t "$COMPATIBILITY_POLICY_SHA")" = commit
            git merge-base --is-ancestor \
              "$LEGACY_POLICY_ANCHOR_SHA" "$COMPATIBILITY_POLICY_SHA"
            git merge-base --is-ancestor \
              "$COMPATIBILITY_POLICY_SHA" "$candidate_sha"

            for pinned_path in \
              governance/client-conformance.json \
              governance/schema-compatibility.json \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl \
              crates/eval/src/contract.rs \
              crates/cli/src/main.rs \
              crates/cli/src/output.rs
            do
              read -r candidate_mode candidate_type candidate_oid candidate_path \
                <<<"$(git ls-tree "$candidate_sha" -- "$pinned_path")"
              read -r policy_mode policy_type policy_oid policy_path \
                <<<"$(git ls-tree "$COMPATIBILITY_POLICY_SHA" -- "$pinned_path")"
              test "$candidate_mode" = 100644
              test "$candidate_type" = blob
              [[ "$candidate_oid" =~ ^[0-9a-f]{40}$ ]]
              test "$candidate_path" = "$pinned_path"
              test "$policy_mode" = 100644
              test "$policy_type" = blob
              [[ "$policy_oid" =~ ^[0-9a-f]{40}$ ]]
              test "$policy_oid" = "$candidate_oid"
              test "$policy_path" = "$pinned_path"
            done

            test ! -e "$PROJECTION_ROOT"
            test ! -e "$COMPATIBILITY_POLICY_ROOT"
            git worktree add --detach "$PROJECTION_ROOT" "$candidate_sha"
            git worktree add --detach \
              "$COMPATIBILITY_POLICY_ROOT" "$COMPATIBILITY_POLICY_SHA"
            test -z "$(git -C "$PROJECTION_ROOT" status --porcelain=v1 \
              --untracked-files=all)"

            manifest=$PROJECTION_ROOT/governance/schema-compatibility.json
            projected_manifest=$PROJECTION_ROOT/governance/.schema-compatibility.projected.json
            test ! -L "$manifest"
            test ! -e "$projected_manifest"
            test ! -L "$projected_manifest"
            test "$(jq '
              [.surfaces[]
                | select(.id == "cli.machine-stream.input-attachment")]
              | length
            ' "$manifest")" = 1
            jq '
              .surfaces |= map(
                select(.id != "cli.machine-stream.input-attachment")
              )
            ' "$manifest" > "$projected_manifest"
            mv "$projected_manifest" "$manifest"
            test "$(jq '
              [.surfaces[]
                | select(.id == "cli.machine-stream.input-attachment")]
              | length
            ' "$manifest")" = 0

            git -C "$PROJECTION_ROOT" rm --quiet -- \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl
            git -C "$PROJECTION_ROOT" checkout "$POLICY_SHA" -- \
              crates/cli/src/main.rs crates/eval/src/contract.rs

            projected_paths=$RUNNER_TEMP/core-policy-projected-paths
            test ! -e "$projected_paths"
            git -C "$PROJECTION_ROOT" diff --name-only HEAD -- > "$projected_paths"
            diff -u <(printf '%s\n' \
              crates/cli/src/main.rs \
              crates/cli/tests/golden/input_attachment_stream_v5.jsonl \
              crates/eval/src/contract.rs \
              governance/schema-compatibility.json) "$projected_paths"
            test -z "$(git -C "$PROJECTION_ROOT" status --porcelain=v1 \
              --untracked-files=all | grep '^??' || true)"

            candidate_root=$PROJECTION_ROOT
            compatibility_active=true
          fi

          {
            echo "active=$compatibility_active"
            echo "candidate-root=$candidate_root"
          } >> "$GITHUB_OUTPUT"
      - name: build trusted base validator
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        working-directory: ${{ runner.temp }}/core-policy-base
        run: cargo build --locked -p iteron-xtask
      - name: verify captured client runtime evidence with trusted base policy
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        shell: bash
        env:
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          COMPATIBILITY_POLICY_SHA: 2c17775f7df54581eebee3fe49b00d5d0db16fe9
          GH_TOKEN: ${{ github.token }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_SHA: ${{ steps.policy.outputs.policy-sha }}
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          verifier=$POLICY_ROOT/release-tools/client_runtime_receipt.py
          if [[ ! -e "$verifier" ]]; then
            test ! -L "$verifier"
            candidate_sha=$(git rev-parse --verify 'HEAD^{commit}')
            [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
            test "$(git cat-file -t "$COMPATIBILITY_POLICY_SHA")" = commit
            git merge-base --is-ancestor \
              "$COMPATIBILITY_POLICY_SHA" "$candidate_sha"

            manifest=governance/client-conformance.json
            read -r candidate_mode candidate_type candidate_oid candidate_path \
              <<<"$(git ls-tree "$candidate_sha" -- "$manifest")"
            read -r policy_mode policy_type policy_oid policy_path \
              <<<"$(git ls-tree "$COMPATIBILITY_POLICY_SHA" -- "$manifest")"
            test "$candidate_mode" = 100644
            test "$candidate_type" = blob
            [[ "$candidate_oid" =~ ^[0-9a-f]{40}$ ]]
            test "$candidate_path" = "$manifest"
            test "$policy_mode" = 100644
            test "$policy_type" = blob
            test "$policy_oid" = "$candidate_oid"
            test "$policy_path" = "$manifest"
            test "$(git cat-file -s "$candidate_oid")" -le 65536
            test -x "$POLICY_BIN"
            test ! -L "$POLICY_BIN"
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check
            jq -e '
              .schema_version == 2
              and .runtime_builder == null
              and .runtime_receipt == null
              and .version_independence.status == "pending"
              and (.platform_smoke | length == 4)
              and ([.platform_smoke[].status] | all(. == "pending"))
            ' < <(git cat-file blob "$candidate_oid") >/dev/null
            evidence_paths=$RUNNER_TEMP/core-runtime-bootstrap-evidence-paths
            test ! -e "$evidence_paths"
            git -C "$GITHUB_WORKSPACE" ls-tree -r -z "$candidate_sha" -- \
              governance/client-conformance/runtime > "$evidence_paths"
            test ! -s "$evidence_paths"
            printf 'one-time null/pending client runtime receipt bootstrap validated\n'
            exit 0
          fi
          test -f "$verifier"
          test ! -L "$verifier"
          arguments=(
            verify-evidence
            --root "$GITHUB_WORKSPACE"
            --trusted-commit "$POLICY_SHA"
            --require-attestation
          )
          builder_commit=$(jq -er '
            if .runtime_builder == null then
              ""
            else
              .runtime_builder.commit
            end
          ' "$POLICY_ROOT/governance/client-conformance.json")
          if [[ -n "$builder_commit" ]]; then
            arguments+=(--trusted-builder-commit "$builder_commit")
          fi
          python3 -I "$verifier" "${arguments[@]}"
      - name: validate candidate against published schema chronology
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          if [[ ! -f "$POLICY_ROOT/release-tools/schema_release.py" ]]; then
            printf 'published schema chronology activates after the bootstrap policy lands\n'
            exit 0
          fi

          candidate_schema=$CANDIDATE_ROOT/governance/schema-compatibility.json
          policy_schema=$POLICY_ROOT/governance/schema-compatibility.json
          for schema in "$candidate_schema" "$policy_schema"; do
            test ! -L "$schema"
            test -f "$schema"
          done
          if cmp -s "$policy_schema" "$candidate_schema"; then
            printf 'schema contract is unchanged from trusted base\n'
            exit 0
          fi

          api_version=2026-03-10
          pages=$RUNNER_TEMP/core-schema-release-pages.jsonl
          releases=$RUNNER_TEMP/core-schema-releases.json
          : > "$pages"
          for page in $(seq 1 11); do
            page_json=$RUNNER_TEMP/core-schema-release-page-$page.json
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
              --jq '[.[] | {tag_name, draft, prerelease, immutable}]' \
              > "$page_json"
            jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
            count=$(jq -r 'length' "$page_json")
            if [[ "$page" -eq 11 ]]; then
              if [[ "$count" -ne 0 ]]; then
                printf 'published release inventory exceeds the 1,000-release limit\n' >&2
                exit 1
              fi
              break
            fi
            jq -c '.' "$page_json" >> "$pages"
            [[ "$count" -eq 100 ]] || break
          done
          jq -s '.' "$pages" > "$releases"

          previous=$(python3 "$POLICY_ROOT/release-tools/schema_release.py" \
            --input "$releases" --latest)
          if [[ "$previous" == BOOTSTRAP ]]; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              schema-compat check-bootstrap
            exit 0
          fi

          [[ "$previous" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$previous")" = tag
          previous_commit=$(git rev-parse "refs/tags/$previous^{commit}")
          candidate_commit=$(git rev-parse HEAD)
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$previous_commit" "$candidate_commit"
          gh release verify "$previous" --repo "$GITHUB_REPOSITORY"
          if git diff --quiet \
            "$previous_commit" "$candidate_commit" \
            -- governance/schema-compatibility.json; then
            printf 'schema contract is unchanged from published release %s\n' "$previous"
            exit 0
          fi

          release_policy_root=$RUNNER_TEMP/core-schema-published-policy
          release_policy_target=$RUNNER_TEMP/core-schema-published-target
          git worktree add --detach "$release_policy_root" "$previous_commit"
          (
            cd "$release_policy_root"
            CARGO_TARGET_DIR="$release_policy_target" \
              cargo build --locked -p iteron-xtask
          )
          "$release_policy_target/debug/iteron-xtask" \
            --repo "$CANDIDATE_ROOT" \
            schema-compat check-release --base "$previous_commit"
      - name: validate candidate against its immediate trusted base
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          DIFF_BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: |
          set -euo pipefail
          check='iteron-xtask boundaries check-base --base <rev>'
          if jq -e --arg check "$check" '
            .boundaries[]
            | select(.id == "protocol-compat")
            | .checks
            | index($check) != null
          ' "$POLICY_ROOT/governance/boundaries.json" >/dev/null; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              boundaries check-base --base "$DIFF_BASE_SHA"
          elif [[ -f "$POLICY_ROOT/governance/schema-compatibility.json" ]]; then
            "$POLICY_BIN" --repo "$CANDIDATE_ROOT" \
              schema-compat check-base --base "$DIFF_BASE_SHA"
          else
            printf 'one-time schema compatibility bootstrap; no trusted contract exists yet\n'
          fi
      - name: validate candidate with trusted base policy
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check'
      - name: summarize pull request boundary impact
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries affected --base "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"'
      - name: validate pull request responsibility contract
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ steps.policy.outputs.diff-base-sha }}
          CANDIDATE_ROOT: ${{ steps.compatibility.outputs.candidate-root }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/iteron-xtask
          PR_BODY: ${{ github.event.pull_request.body }}
        run: '"$POLICY_BIN" --repo "$CANDIDATE_ROOT" boundaries check-pr --base "$BASE_SHA"'
      - name: build one-time compatibility validator
        if: steps.compatibility.outputs.active == 'true'
        working-directory: ${{ runner.temp }}/core-policy-compatibility
        run: cargo build --locked -p iteron-xtask
      - name: validate real candidate with one-time compatibility policy
        if: steps.compatibility.outputs.active == 'true'
        env:
          COMPATIBILITY_POLICY_BIN: ${{ runner.temp }}/core-policy-compatibility/target/debug/iteron-xtask
        run: >-
          "$COMPATIBILITY_POLICY_BIN" --repo "$GITHUB_WORKSPACE"
          boundaries check

  docs:
    name: docs / strict-build
    needs: route
    if: needs.route.outputs.docs == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.lock
      - name: validate documentation sources
        run: release-tools/check_docs.sh
      - name: install hash-locked documentation dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements-docs.lock
      - name: build documentation with warnings denied
        env:
          NO_MKDOCS_2_WARNING: "true"
          PYTHONUTF8: "1"
        run: mkdocs build --strict --clean

  test:
    name: rust / ubuntu-24.04
    needs: route
    if: needs.route.outputs.rust == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      # `cargo test --workspace` runs the xtask conformance suite, and
      # `current_tcb_snapshot_matches_the_w1_freeze` resolves the W1 freeze commit through git.
      # A shallow checkout does not contain that commit, so the whole matrix fails on
      # `cannot resolve compatibility base revision`. The boundary job fetches full history for
      # the same reason.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: isolate the persistent Cargo cache by runner
        run: |
          [[ "$RUNNER_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          printf 'CARGO_TARGET_DIR=/var/tmp/iteron-ci-target/%s\n' \
            "$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: clippy,rustfmt
      # The runner administrator provisions this host boundary once. CI verifies it instead of
      # mutating the persistent DGX with passwordless sudo on every pull request.
      - name: verify bubblewrap boundary is provisioned
        run: |
          command -v bwrap
          bwrap --version
      - name: format
        shell: bash
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        shell: bash
        run: cargo test --workspace --all-targets --locked

  # Non-blocking by construction (`continue-on-error`). The suite has 1613 functional tests and
  # not one wall-clock bound, so a one-line concurrency hazard — a lock held across an await, an
  # fsync moved into a loop — merges green (I-57). This replays a fixed script against the
  # loopback fixture provider and asserts a loose ceiling on `kernel_tax`, the harness's own
  # admission/broker/fsync microseconds, so the provider contributes nothing to the number. The
  # budget sits at 1.75x an observed min-of-5 floor: a 2x regression fails it, ordinary variance
  # does not. `ITERON_HARNESS_TAX_BUDGET_US` re-bases it if this runner is simply slower.
  harness-latency:
    name: perf / harness latency
    needs: route
    if: needs.route.outputs.perf == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: isolate the persistent Cargo cache by runner
        run: |
          [[ "$RUNNER_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          printf 'CARGO_TARGET_DIR=/var/tmp/iteron-ci-target/%s\n' \
            "$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      # `--ignored` is the whole gate: the merge lane never spends wall-clock time on timing, and
      # this job never blocks a merge on a runner having a bad minute.
      - name: harness-attributable latency budget
        run: >-
          cargo test --locked -p iteron-cli --test harness_latency --
          --ignored --nocapture

  evolution-gate:
    name: gate / evolution
    needs: route
    if: needs.route.outputs.evolution == 'true'
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 20
    steps:
      # The evolution rows cite tests in crates/agents and crates/cli as well as crates/evolve, and
      # the row validator resolves every citation against the checkout. It reads files, not git
      # history, so a shallow checkout is sufficient here.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: isolate the persistent Cargo cache by runner
        run: |
          [[ "$RUNNER_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          printf 'CARGO_TARGET_DIR=/var/tmp/iteron-ci-target/%s\n' \
            "$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      # Fails on any row that names no plane placement, cites a test that does not exist, names a
      # world module that is not on disk, or leaves a proven module or algebra operator unclaimed.
      # There is no target-only state to suppress: an unbacked row is a red gate.
      - name: evolution conformance rows
        run: cargo run --locked -p iteron-evolve --bin evolve-transcript -- gate rows --repo .
      # Runs the offline transcript twice under each producer order, verifies both hash chains,
      # replays each promotion journal, exercises the checkpoint algebra, and proves the evaluator
      # and promotion roles are not interchangeable. Non-zero exit means a module is unproven.
      - name: evolution-proven gate artifact
        run: >-
          cargo run --locked -p iteron-evolve --bin evolve-transcript -- gate prove --repo .
          --scratch "$RUNNER_TEMP/evolution-gate"
      # The gate's own determinism and no-overclaim assertions. Kept separate from the binary run so
      # a report that passes for the wrong reason still turns this job red.
      - name: evolution gate assertions
        run: cargo test --locked -p iteron-evolve --all-targets

  release-build:
    name: release build / linux-arm64
    if: >-
      always() &&
      needs.route.outputs.release_build == 'true' &&
      needs.route.result == 'success' &&
      needs.boundary.result == 'success' &&
      needs.test.result == 'success' &&
      (needs.route.outputs.audit != 'true' || needs.dependency-audit.result == 'success')
    needs: [route, boundary, dependency-audit, test]
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: isolate the persistent Cargo cache by runner
        run: |
          [[ "$RUNNER_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          printf 'CARGO_TARGET_DIR=/var/tmp/iteron-ci-target/%s\n' \
            "$RUNNER_NAME" >> "$GITHUB_ENV"
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: build release
        shell: bash
        run: cargo build --release -p iteron-cli --locked
      # This main-branch smoke build never distributes a naked binary. Only the
      # protected tag workflow packages licenses, notices, SBOMs, and provenance.

  review-policy:
    name: review / required-humans
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review'
    uses: ./.github/workflows/review-policy.yml

  required:
    name: ${{ github.event_name == 'pull_request_review' && 'ci / review-event' || 'ci / required' }}
    if: always()
    needs:
      - route
      - supply
      - dependency-audit
      - dependency-check
      - boundary
      - docs
      - test
      - harness-latency
      - evolution-gate
      - release-build
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 5
    steps:
      - name: prove every routed lane executed successfully
        shell: bash
        env:
          AUDIT_EXPECTED: ${{ needs.route.outputs.audit }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          BOUNDARY_EXPECTED: ${{ needs.route.outputs.boundary }}
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
          CHANGE_CLASS: ${{ needs.route.outputs.change_class }}
          DEPENDENCY_CHECK_EXPECTED: ${{ needs.route.outputs.dependency_check }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
          DOCS_EXPECTED: ${{ needs.route.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          EVOLUTION_EXPECTED: ${{ needs.route.outputs.evolution }}
          EVOLUTION_RESULT: ${{ needs.evolution-gate.result }}
          PERF_EXPECTED: ${{ needs.route.outputs.perf }}
          PERF_RESULT: ${{ needs.harness-latency.result }}
          RELEASE_EXPECTED: ${{ needs.route.outputs.release_build }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
          RUST_EXPECTED: ${{ needs.route.outputs.rust }}
          RUST_RESULT: ${{ needs.test.result }}
          SUPPLY_EXPECTED: ${{ needs.route.outputs.supply }}
          SUPPLY_RESULT: ${{ needs.supply.result }}
        run: |
          set -euo pipefail
          failed=0
          rows=()

          require_result() {
            local name=$1 expected=$2 result=$3
            rows+=("| $name | $expected | $result |")
            if [[ "$expected" == true ]]; then
              if [[ "$result" != success ]]; then
                echo "required lane $name did not execute successfully: $result" >&2
                failed=1
              fi
            elif [[ "$result" != skipped ]]; then
              echo "unrouted lane $name unexpectedly executed: $result" >&2
              failed=1
            fi
          }

          if [[ "$ROUTE_RESULT" != success ]]; then
            echo "route did not execute successfully: $ROUTE_RESULT" >&2
            failed=1
          fi
          require_result supply "$SUPPLY_EXPECTED" "$SUPPLY_RESULT"
          require_result dependency-audit "$AUDIT_EXPECTED" "$AUDIT_RESULT"
          require_result dependency-check "$DEPENDENCY_CHECK_EXPECTED" "$DEPENDENCY_CHECK_RESULT"
          require_result boundary "$BOUNDARY_EXPECTED" "$BOUNDARY_RESULT"
          require_result docs "$DOCS_EXPECTED" "$DOCS_RESULT"
          require_result rust "$RUST_EXPECTED" "$RUST_RESULT"
          require_result perf "$PERF_EXPECTED" "$PERF_RESULT"
          require_result evolution "$EVOLUTION_EXPECTED" "$EVOLUTION_RESULT"
          require_result release-build "$RELEASE_EXPECTED" "$RELEASE_RESULT"

          {
            echo "## Required CI result"
            echo
            echo "Change class: \`$CHANGE_CLASS\`"
            echo
            echo "| Lane | Routed | Result |"
            echo "| --- | --- | --- |"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"
      - name: report executed minutes by lane
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {...context.repo, run_id: context.runId, per_page: 100}
            );
            const completed = jobs.filter((job) => job.started_at && job.completed_at);
            const rows = completed.map((job) => {
              const milliseconds =
                new Date(job.completed_at).getTime() - new Date(job.started_at).getTime();
              return [
                job.name,
                job.conclusion || job.status,
                (milliseconds / 60000).toFixed(2),
              ];
            });
            const total = completed.reduce((sum, job) => {
              return sum +
                (new Date(job.completed_at).getTime() - new Date(job.started_at).getTime());
            }, 0);
            await core.summary
              .addHeading("Executed CI minutes")
              .addTable([
                [
                  {data: "Lane", header: true},
                  {data: "Result", header: true},
                  {data: "Minutes", header: true},
                ],
                ...rows,
              ])
              .addRaw(`\nTotal completed job minutes: ${(total / 60000).toFixed(2)}\n`)
              .write();
