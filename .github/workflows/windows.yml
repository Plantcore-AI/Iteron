name: windows
# Windows CI, restored onto hardware this project owns.
#
# History, so the next reader does not mistake this for a revert: an advisory `windows-2025` lane
# used to live here and in `ci.yml`. #275 dropped the Windows legs while aligning the release
# contracts, and #277 deleted this file while routing CI to the DGX. That removal was a hosted-cost
# decision (#223, "CI is too heavy"), not a judgement that Windows should never be checked again.
# #227 is the follow-up: put Windows on a machine we own. This file is that lane.
#
# It is NON-BLOCKING, and it is non-blocking for exactly one reason: it is not in the branch
# ruleset's required contexts. It deliberately does NOT use `continue-on-error` — #196 recorded
# what that costs, an unstarted runner reporting green. A failure here reports as a failure.
#
# Ordinary PR/push runs check the workspace on the selected native Windows runner. The explicit
# workflow_dispatch additionally compiles default/script test cohorts once each and executes exact
# required native sets: retained Job/ConPTY/pipes, sealed LPAC setup/factory, environment/filesystem/
# network denial, registered process/LSP and private journal/restart cases. Missing or cfg-empty
# sets, unknown cleanup and failed native cases fail the job. Artifact receipts bind source and
# compiler bytes; they do not certify the whole product or make the TUI a supported Windows SLA.
#
# Source contains a Windows LPAC backend. Native availability and support remain subject to the
# exact selected candidate's real oracles; docs/reference/platforms.md records that distinction.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.90.0
  # Give the Windows binary the 8 MiB main-thread stack every other target already has. Windows
  # reserves 1 MiB, the CLI's entry future does not fit in it, and `iteron.exe -V` died with
  # `thread 'main' has overflowed its stack` (0xC00000FD) before printing anything -- which is
  # also why the ConPTY oracle below only ever captured an empty terminal.
  #
  # It is stated here, and again on the Windows leg of `release.yml`, because the three tidier
  # places are all closed by conformance: a `build.rs` is an implicit Cargo target, a repository
  # `.cargo/config.toml` is not admitted by schema dependency authority, and `main` is a
  # trusted-base schema function. Spawning the entry path onto a sized thread was tried and
  # reverted; it tripped that guard and regressed `tui_pty`.
  #
  # The gap this leaves is honest and worth knowing: a Windows build made outside CI does not get
  # this flag, so a developer building locally will still hit the overflow.
  RUSTFLAGS: -C link-arg=/STACK:8388608

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: windows / check
    # Skipped, not queued, until the machine exists. Pointing a job at a self-hosted label that no
    # runner answers leaves it queued forever — this org has already lost CI to exactly that on
    # Iteron-internal. So the lane stays dormant until an operator publishes the labels:
    #   gh variable set WINDOWS_RUNNER_LABELS --repo Plantcore-AI/Iteron \
    #     --body '["self-hosted","Windows","X64","iteron-win"]'
    # A skipped job is honestly skipped; it never reports a pass it did not earn.
    if: vars.WINDOWS_RUNNER_LABELS != ''
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER_LABELS || '["windows-latest"]') }}
    # A cold MSVC build of this workspace is slow, and the self-hosted box is 4 vCPU.
    timeout-minutes: 180
    defaults:
      run:
        # Windows PowerShell 5.1 ships with Windows Server; `pwsh` is not guaranteed on a machine
        # we provisioned ourselves, and `bash` only exists there via Git for Windows.
        shell: powershell
    steps:
      # Git transport to github.com is repeatedly reset from this Windows host, while the GitHub
      # API and its codeload redirect remain reachable. Materialize the exact immutable commit
      # without a `.git` directory; this job only checks/builds/tests and never needs repository
      # history. For a fork PR, both repository and SHA come from the PR head, so this cannot
      # silently compile the base repository at an unrelated commit.
      - name: materialize the exact source through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$') {
            throw 'unexpected source repository'
          }
          $repositoryParts = $env:SOURCE_REPOSITORY.Split('/')
          if ($repositoryParts.Count -ne 2 -or $repositoryParts -contains '.' -or $repositoryParts -contains '..') {
            throw 'unsafe source repository'
          }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'unexpected source commit'
          }

          $maximumArchiveBytes = 268435456
          $maximumMembers = 20000
          $maximumUnpackedBytes = 1073741824
          $materialization = Join-Path $env:RUNNER_TEMP ("iteron-source-$env:SOURCE_SHA")
          if (Test-Path -LiteralPath $materialization) {
            Remove-Item -LiteralPath $materialization -Recurse -Force
          }
          $null = New-Item -ItemType Directory -Path $materialization
          $archivePath = Join-Path $materialization 'source.zip'
          $extractPath = Join-Path $materialization 'extract'
          $null = New-Item -ItemType Directory -Path $extractPath
          $apiUrl = "https://api.github.com/repos/$env:SOURCE_REPOSITORY/zipball/$env:SOURCE_SHA"

          # curl does not forward Authorization to the cross-host codeload redirect unless
          # --location-trusted is used. Deliberately do not use that option: the token is sent
          # only to api.github.com and never becomes a codeload credential.
          & curl.exe --proto '=https' --tlsv1.2 --fail --location `
            --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 --max-filesize $maximumArchiveBytes `
            --header "Accept: application/vnd.github+json" `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --header "X-GitHub-Api-Version: 2026-03-10" `
            --output $archivePath $apiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "source download failed with curl exit code $LASTEXITCODE"
          }
          $archiveBytes = (Get-Item -LiteralPath $archivePath).Length
          if ($archiveBytes -le 0 -or $archiveBytes -gt $maximumArchiveBytes) {
            throw 'source archive is empty or oversized'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destinationRoot = [System.IO.Path]::GetFullPath($extractPath)
          if (-not $destinationRoot.EndsWith([string][System.IO.Path]::DirectorySeparatorChar)) {
            $destinationRoot += [System.IO.Path]::DirectorySeparatorChar
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            if ($zip.Entries.Count -le 0 -or $zip.Entries.Count -gt $maximumMembers) {
              throw 'source archive has an invalid member count'
            }
            $archiveRoot = $null
            $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
            [long]$unpackedBytes = 0
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName
              if ([string]::IsNullOrWhiteSpace($name) -or $name.Contains('\') -or
                  $name.Contains(':') -or $name.StartsWith('/') -or
                  [System.IO.Path]::IsPathRooted($name)) {
                throw "unsafe source archive path: $name"
              }
              $segments = $name.TrimEnd('/').Split('/')
              if ($segments.Count -eq 0 -or $segments -contains '' -or
                  $segments -contains '.' -or $segments -contains '..') {
                throw "source archive path escapes its root: $name"
              }
              if ($null -eq $archiveRoot) {
                $archiveRoot = $segments[0]
              } elseif ($segments[0] -cne $archiveRoot) {
                throw 'source archive contains more than one root'
              }
              if (-not $seen.Add($name)) {
                throw "source archive repeats a member: $name"
              }

              $isDirectory = [string]::IsNullOrEmpty($entry.Name)
              if ($isDirectory -ne $name.EndsWith('/')) {
                throw "source archive member type disagrees with its path: $name"
              }
              $fileType = (([int]$entry.ExternalAttributes -shr 16) -band 0xF000)
              if ($fileType -ne 0) {
                $requiredType = if ($isDirectory) { 0x4000 } else { 0x8000 }
                if ($fileType -ne $requiredType) {
                  throw "source archive contains a link or special file: $name"
                }
              }
              if (-not $isDirectory) {
                $unpackedBytes += [long]$entry.Length
                if ($entry.Length -lt 0 -or $unpackedBytes -gt $maximumUnpackedBytes) {
                  throw 'source archive exceeds the unpacked byte limit'
                }
              }

              $relative = $name.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              $destination = [System.IO.Path]::GetFullPath(
                [System.IO.Path]::Combine($destinationRoot, $relative)
              )
              if (-not $destination.StartsWith($destinationRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "source archive member escapes the destination: $name"
              }
              if ($isDirectory) {
                $null = New-Item -ItemType Directory -Path $destination -Force
              } else {
                $parent = [System.IO.Path]::GetDirectoryName($destination)
                if (-not (Test-Path -LiteralPath $parent -PathType Container)) {
                  $null = New-Item -ItemType Directory -Path $parent -Force
                }
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $false)
              }
            }
          } finally {
            $zip.Dispose()
          }

          $sourceRoot = Join-Path $extractPath $archiveRoot
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'Cargo.toml') -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $sourceRoot '.github/workflows/windows.yml') -PathType Leaf)) {
            throw 'source archive does not contain the expected Iteron workspace'
          }
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $runnerWorkspace = [System.IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          if (-not $runnerWorkspace.EndsWith([string][System.IO.Path]::DirectorySeparatorChar)) {
            $runnerWorkspace += [System.IO.Path]::DirectorySeparatorChar
          }
          if (-not $workspace.StartsWith($runnerWorkspace, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'GITHUB_WORKSPACE is outside RUNNER_WORKSPACE'
          }
          if (-not (Test-Path -LiteralPath $workspace -PathType Container)) {
            $null = New-Item -ItemType Directory -Path $workspace
          }
          Get-ChildItem -LiteralPath $workspace -Force |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $sourceRoot -Force |
            Move-Item -Destination $workspace -Force
          if (-not (Test-Path -LiteralPath (Join-Path $workspace 'Cargo.toml') -PathType Leaf)) {
            throw 'source materialization did not populate GITHUB_WORKSPACE'
          }

          # Stamp every materialized file with the current time.
          #
          # Zip entries carry their own timestamps, so extraction reproduces mtimes that are older
          # than the artifacts already sitting in the persistent CARGO_TARGET_DIR. Cargo decides
          # freshness by comparing mtimes, so it concluded that a tree containing brand new commits
          # was already built and skipped the work: a job finished its build step in 0.94s and then
          # tested an `iteron.exe` from an hour earlier, which still carried a bug the commit under
          # test had fixed. A lane that certifies a stale binary is worse than no lane, and nothing
          # in the log says so.
          #
          # `git clone` never had this problem because it writes files as it creates them. This
          # restores that property for the archive path.
          $stamp = Get-Date
          Get-ChildItem -LiteralPath $workspace -Recurse -Force -File |
            ForEach-Object { $_.LastWriteTime = $stamp }
      # Self-hosted workspaces persist between runs, unlike hosted images. Two runners on one host
      # would otherwise share a `target/` and deadlock on cargo's file lock, so key it by runner
      # name the same way the DGX lanes in `ci.yml` do.
      - name: isolate the persistent Cargo cache by runner
        run: |
          if ($env:RUNNER_NAME -notmatch '^[A-Za-z0-9._-]{1,64}$') {
            throw "unexpected RUNNER_NAME"
          }
          "CARGO_TARGET_DIR=C:\iteron-ci-target\$env:RUNNER_NAME" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      - name: install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - name: check the workspace for Windows
        if: github.event_name != 'workflow_dispatch'
        run: cargo check --workspace --locked --target x86_64-pc-windows-msvc
      - name: exact native owned-process proof on the selected branch
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 150
        env:
          CARGO_BUILD_JOBS: 4
          RUST_TEST_THREADS: 1
          ITERON_TEST_TIMEOUT_SCALE: 10
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'native process gate requires the exact selected commit on Windows'
          }
          Write-Host "Native process source: $env:GITHUB_SHA; runner: $env:RUNNER_NAME"
          # The source comes from the exact API materializer above. Reuse only this runner's
          # target, with refreshed source mtimes; do not test another checkout or old executable.
          if ([string]::IsNullOrEmpty($env:CARGO_TARGET_DIR)) { throw 'missing isolated Cargo target' }

          function Read-PrerequisitePipe($reader) {
            $buffer = New-Object char[] 1025
            $read = $reader.ReadAsync($buffer, 0, $buffer.Length)
            if (-not $read.Wait(2000) -or $read.Result -ge $buffer.Length) {
              throw 'native prerequisite output unavailable or oversized'
            }
            $count = $read.Result
            $tail = New-Object char[] 1
            $end = $reader.ReadAsync($tail, 0, 1)
            if (-not $end.Wait(2000) -or $end.Result -ne 0) {
              throw 'native prerequisite output did not end at its bounded receipt'
            }
            if ($count -eq 0) { return '' }
            return (-join $buffer[0..($count - 1)])
          }
          function Invoke-Prerequisite([string]$executable, [string]$arguments) {
            if (-not [System.IO.Path]::IsPathRooted($executable)) {
              throw 'native prerequisite executable must be an absolute selected path'
            }
            $executable = [System.IO.Path]::GetFullPath($executable)
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "native prerequisite selected executable is absent: $executable"
            }
            $workingDirectory = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
            if (-not (Test-Path -LiteralPath $workingDirectory -PathType Container)) {
              throw 'native prerequisite selected source working directory is absent'
            }
            Write-Host "Native prerequisite executable: $executable; cwd: $workingDirectory"
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo.FileName = $executable
            $process.StartInfo.Arguments = $arguments
            $process.StartInfo.WorkingDirectory = $workingDirectory
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.CreateNoWindow = $true
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            foreach ($key in @($process.StartInfo.EnvironmentVariables.Keys)) {
              if ($key -in @('BASH_ENV', 'ENV', 'BASHOPTS', 'SHELLOPTS', 'PROMPT_COMMAND', 'LD_PRELOAD') -or
                  $key.StartsWith('BASH_FUNC_')) {
                $process.StartInfo.EnvironmentVariables.Remove($key)
              }
            }
            try {
              try {
                $started = $process.Start()
              } catch [System.ComponentModel.Win32Exception] {
                $nativeError = $_.Exception.GetBaseException().NativeErrorCode
                throw "native prerequisite launch unavailable (Win32 $nativeError): executable=$executable; cwd=$workingDirectory"
              }
              if (-not $started) { throw 'native prerequisite did not start' }
              if (-not $process.WaitForExit(10000)) {
                try { $process.Kill() } catch { }
                $null = $process.WaitForExit(2000)
                throw 'native prerequisite timed out; no platform proof recorded'
              }
              $stdout = Read-PrerequisitePipe $process.StandardOutput
              $stderr = Read-PrerequisitePipe $process.StandardError
              if ($process.ExitCode -ne 0 -or $stderr.Length -ne 0) {
                throw 'native prerequisite refused; no platform proof recorded'
              }
              return $stdout
            } finally { $process.Dispose() }
          }
          # Require the actual Git for Windows installation, then select its own Bash for the
          # product fixtures. A WSL alias or merely finding some command named bash is insufficient.
          function Resolve-NativeApplication([string]$name) {
            $commands = @(Get-Command -Name $name -CommandType Application -TotalCount 1 -ErrorAction Stop)
            if ($commands.Count -ne 1 -or
                $commands[0] -isnot [System.Management.Automation.ApplicationInfo]) {
              throw "native prerequisite requires one selected application: $name"
            }
            # Never coerce a command collection into a path passed to .NET. Retain enough
            # nonsecret selection evidence to distinguish lookup from normalization failures.
            $path = $commands[0].Path
            if ($path -isnot [string] -or [string]::IsNullOrEmpty($path)) {
              throw "native prerequisite selected application has no scalar path: $name"
            }
            Write-Host "Native prerequisite selected command: $name; count: $($commands.Count); type: ApplicationInfo; path length: $($path.Length)"
            if (-not [System.IO.Path]::IsPathRooted($path)) {
              throw "native prerequisite selected application path is not rooted: $name"
            }
            try {
              $path = [System.IO.Path]::GetFullPath($path)
            } catch {
              $failureType = $_.Exception.GetBaseException().GetType().Name
              throw "native prerequisite selected path normalization failed: command=$name; type=$failureType; length=$($path.Length)"
            }
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "native prerequisite selected application is absent: $name"
            }
            return $path
          }
          $git = Resolve-NativeApplication 'git.exe'
          $version = Invoke-Prerequisite $git '--version'
          if ($version -notmatch '^git version [^\r\n]+\.windows\.[0-9]+\s*$') {
            throw 'native shell gate requires Git for Windows'
          }
          $directory = [System.IO.Path]::GetDirectoryName($git)
          $bash = $null
          for ($depth = 0; $depth -lt 4 -and $directory -and -not $bash; $depth++) {
            foreach ($relative in @('bin\bash.exe', 'usr\bin\bash.exe')) {
              $candidate = Join-Path $directory $relative
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { $bash = $candidate; break }
            }
            $directory = [System.IO.Path]::GetDirectoryName($directory)
          }
          if (-not $bash) { throw 'Git for Windows Bash is unavailable' }
          $bash = [System.IO.Path]::GetFullPath($bash)
          $probe = Invoke-Prerequisite $bash '--noprofile --norc -c "printf iteron-native-bash-prerequisite"'
          if ($probe -cne 'iteron-native-bash-prerequisite') { throw 'actual Bash prerequisite failed' }
          $env:PATH = "$(Split-Path -Parent $bash);$env:PATH"
          $resolved = Resolve-NativeApplication 'bash.exe'
          if ($resolved -ne $bash) {
            throw 'product Bash resolution differs from its native prerequisite'
          }
          Remove-Item Env:ITERON_WINDOWS_JOB_FIXTURE_MODE -ErrorAction SilentlyContinue
          Remove-Item Env:ITERON_WINDOWS_JOB_FIXTURE_ROOT -ErrorAction SilentlyContinue

          # One default/script compiler-artifact cohort each, followed by direct frozen native
          # binary listing/execution. The driver owns a private Job before initial resume, retains
          # bounded logs and immutable copies, and requires waited leader + Job0 + stream closure.
          $python = Resolve-NativeApplication 'python.exe'
          & $python scripts/windows-native-cohort.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: retain exact native Windows source and compiler receipts
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iteron-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
