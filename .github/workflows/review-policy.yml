name: review-policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-humans:
    name: review / required-humans
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: materialize trusted base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_ROOT: ${{ runner.temp }}/core-policy-base
        run: git worktree add --detach "$POLICY_ROOT" "$BASE_SHA"
      - name: build trusted base validator
        working-directory: ${{ runner.temp }}/core-policy-base
        run: cargo build --locked -p core-xtask
      - name: validate candidate ownership contract
        env:
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/core-xtask
        run: '"$POLICY_BIN" --repo "$GITHUB_WORKSPACE" boundaries check'
      - name: collect current GitHub reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWS_FILE: ${{ runner.temp }}/reviews.json
        run: >-
          gh api --paginate
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100"
          --jq '.[]' | jq -s . > "$REVIEWS_FILE"
      - name: enforce registered human review groups
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_BIN: ${{ runner.temp }}/core-policy-base/target/debug/core-xtask
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWS_FILE: ${{ runner.temp }}/reviews.json
        run: '"$POLICY_BIN" --repo "$GITHUB_WORKSPACE" boundaries check-reviews --base "$BASE_SHA"'
