name: release

on:
  push:
    tags:
      - "v*"
  # Run the complete validation/legal/native-build/package graph on any selected
  # commit without creating a release. Publish and curl canaries remain tag-only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize every release candidate so two immutable tags cannot race to
  # publish or replace the repository's `latest` release pointer.
  group: iteron-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  # cargo-about invokes Cargo as a child process, so pin the ambient rustup
  # selection in addition to explicit `cargo +VERSION` workflow commands.
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  validate:
    name: release / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      source-date-epoch: ${{ steps.metadata.outputs.source-date-epoch }}
      tree: ${{ steps.metadata.outputs.tree }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --component clippy
          --component rustfmt
      - name: Validate version and release source commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            test "$tag_commit" = "$event_commit"
            git fetch --no-tags origin main
            main_commit=$(git rev-parse 'origin/main^{commit}')
            test "$tag_commit" = "$main_commit"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            tag_commit=$event_commit
          fi

          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          tested_tree=$(git rev-parse "$tag_commit^{tree}")
          [[ "$tested_tree" =~ ^[0-9a-f]{40}$ ]]
          candidate_root=$RUNNER_TEMP/core-schema-candidate
          test ! -e "$candidate_root"
          git worktree add --detach "$candidate_root" "$tag_commit"
          test "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')" = "$tag_commit"
          candidate_status=$RUNNER_TEMP/core-schema-candidate-status
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          test ! -s "$candidate_status"

          # Do not invoke Cargo or any repository script before the immutable
          # predecessor validates this detached tree. Even `cargo metadata` can
          # execute a candidate-controlled rustc-wrapper from .cargo/config.toml.
          root_manifest=$candidate_root/Cargo.toml
          test -f "$root_manifest"
          test ! -L "$root_manifest"
          root_manifest_size=$(stat --format='%s' -- "$root_manifest")
          [[ "$root_manifest_size" =~ ^[0-9]+$ ]]
          test "$root_manifest_size" -le 65536
          version=$(python3 -I - "$candidate_root" <<'PY'
          import pathlib
          import re
          import stat
          import sys
          import tomllib

          MAX_MANIFEST_BYTES = 65_536
          MAX_WORKSPACE_MEMBERS = 128

          def load_manifest(path: pathlib.Path, label: str) -> dict:
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > MAX_MANIFEST_BYTES:
                  raise SystemExit(f"{label} must be a regular file no larger than 64 KiB")
              with path.open("rb") as handle:
                  document = tomllib.load(handle)
              if not isinstance(document, dict):
                  raise SystemExit(f"{label} must contain a TOML table")
              return document

          candidate_root = pathlib.Path(sys.argv[1])
          document = load_manifest(candidate_root / "Cargo.toml", "root Cargo.toml")
          workspace = document.get("workspace")
          if not isinstance(workspace, dict):
              raise SystemExit("root Cargo.toml must define [workspace]")
          package_defaults = workspace.get("package")
          if not isinstance(package_defaults, dict):
              raise SystemExit("root Cargo.toml must define [workspace.package]")
          version = package_defaults.get("version")
          if not isinstance(version, str) or re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version
          ) is None:
              raise SystemExit("workspace.package.version must be strict numeric SemVer")

          members = workspace.get("members")
          if (
              not isinstance(members, list)
              or not 0 < len(members) <= MAX_WORKSPACE_MEMBERS
              or any(not isinstance(member, str) for member in members)
              or len(set(members)) != len(members)
          ):
              raise SystemExit("workspace.members must be a bounded unique string list")
          package_names = set()
          for member in members:
              if len(member) > 256 or re.fullmatch(
                  r"[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*",
                  member,
              ) is None or any(part in (".", "..") for part in member.split("/")):
                  raise SystemExit(f"workspace member path is not explicit and safe: {member!r}")
              directory = candidate_root
              for part in member.split("/"):
                  directory /= part
                  metadata = directory.lstat()
                  if not stat.S_ISDIR(metadata.st_mode):
                      raise SystemExit(f"workspace member traverses a non-directory: {member!r}")
              member_document = load_manifest(
                  directory / "Cargo.toml", f"workspace member {member!r} Cargo.toml"
              )
              package = member_document.get("package")
              if not isinstance(package, dict):
                  raise SystemExit(f"workspace member lacks [package]: {member!r}")
              member_version = package.get("version")
              if member_version != {"workspace": True} and member_version != version:
                  raise SystemExit(
                      f"workspace member {member!r} does not inherit the release version"
                  )
              name = package.get("name")
              if not isinstance(name, str) or re.fullmatch(
                  r"[A-Za-z0-9_-]{1,128}", name
              ) is None or name in package_names:
                  raise SystemExit(f"workspace member has an invalid or duplicate name: {member!r}")
              package_names.add(name)
          print(version)
          PY
          )
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

          epoch=$(git show -s --format=%ct "$tag_commit")
          test "$epoch" -ge 0
          {
            echo "commit=$tag_commit"
            echo "source-date-epoch=$epoch"
            echo "tree=$tested_tree"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Validate against the previous immutable schema release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_version=2026-03-10
          pages=$RUNNER_TEMP/core-schema-release-pages.jsonl
          releases=$RUNNER_TEMP/core-schema-releases.json
          : > "$pages"

          # Page 11 is a sentinel: ten full pages are admitted, while a non-empty
          # eleventh page proves that the 1,000-release policy bound was exceeded.
          for page in $(seq 1 11); do
            page_json=$RUNNER_TEMP/core-schema-release-page-$page.json
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
              --jq '[.[] | {tag_name, draft, prerelease, immutable}]' \
              > "$page_json"
            jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null
            count=$(jq -r 'length' "$page_json")
            if [[ "$page" -eq 11 ]]; then
              if [[ "$count" -ne 0 ]]; then
                printf 'published release inventory exceeds the 1,000-release limit\n' >&2
                exit 1
              fi
              break
            fi
            jq -c '.' "$page_json" >> "$pages"
            [[ "$count" -eq 100 ]] || break
          done
          jq -s '.' "$pages" > "$releases"

          # Select the proposed anchor without executing any candidate-owned
          # repository code. The selected immutable release then recomputes the
          # answer with its own trusted policy before any candidate build runs.
          previous=$(jq -er --arg candidate "$GITHUB_REF_NAME" '
            def semver:
              capture(
                "^v(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)$"
              )
              | [
                  (.major | tonumber),
                  (.minor | tonumber),
                  (.patch | tonumber)
                ];
            ($candidate | semver) as $candidate_version
            | [
                .[][]
                | if ((.draft | type) != "boolean")
                    or ((.prerelease | type) != "boolean")
                  then error("release lacks typed draft/prerelease state")
                  elif .draft or .prerelease
                  then empty
                  elif (.tag_name | type) != "string"
                  then error("published release lacks a string tag_name")
                  else . as $release
                    | ($release.tag_name | try semver catch null) as $version
                    | select($version != null)
                    | {
                        tag_name: $release.tag_name,
                        immutable: $release.immutable,
                        version: $version
                      }
                  end
              ] as $stable
            | if ($stable | group_by(.version) | any(length > 1))
              then error("published SemVer release is duplicated")
              elif any($stable[]; .version >= $candidate_version)
              then error("published release is not older than candidate")
              elif ($stable | length) == 0
              then "BOOTSTRAP"
              else ($stable | max_by(.version)) as $previous
                | if $previous.immutable != true
                  then error("highest previous release is not immutable")
                  else $previous.tag_name
                  end
              end
          ' "$releases")
          candidate_root=$RUNNER_TEMP/core-schema-candidate
          candidate_status=$RUNNER_TEMP/core-schema-candidate-status
          test "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')" = \
            "${{ steps.metadata.outputs.commit }}"
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          test ! -s "$candidate_status"
          validate_cargo_workspace_versions() {
            metadata=$RUNNER_TEMP/core-release-cargo-metadata.json
            (
              cd "$candidate_root"
              CARGO_TARGET_DIR="$RUNNER_TEMP/core-schema-metadata-target" \
                cargo +"$RUST_VERSION" metadata --locked --format-version 1
            ) | head -c 8388609 > "$metadata"
            metadata_size=$(stat --format='%s' -- "$metadata")
            [[ "$metadata_size" =~ ^[0-9]+$ ]]
            test "$metadata_size" -le 8388608
            python3 -I - "$metadata" "$candidate_root" <<'PY'
          import json
          import pathlib
          import stat
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          candidate_root = pathlib.Path(sys.argv[2]).resolve(strict=True)
          with metadata_path.open("rb") as handle:
              document = json.load(handle)
          packages = document.get("packages")
          if not isinstance(packages, list) or not 0 < len(packages) <= 512:
              raise SystemExit("Cargo metadata package inventory is not bounded")

          def require_rooted_regular(raw: object, label: str) -> None:
              if not isinstance(raw, str):
                  raise SystemExit(f"{label} path is not a string")
              path = pathlib.Path(raw)
              if not path.is_absolute():
                  raise SystemExit(f"{label} path is not absolute")
              try:
                  relative = path.relative_to(candidate_root)
              except ValueError:
                  raise SystemExit(f"{label} escapes the validated candidate root") from None
              if any(part in ("", ".", "..") for part in relative.parts):
                  raise SystemExit(f"{label} path is not normalized")
              cursor = candidate_root
              for index, part in enumerate(relative.parts):
                  cursor /= part
                  entry = cursor.lstat()
                  if stat.S_ISLNK(entry.st_mode):
                      raise SystemExit(f"{label} traverses a symbolic link")
                  if index + 1 == len(relative.parts):
                      if not stat.S_ISREG(entry.st_mode):
                          raise SystemExit(f"{label} is not a regular file")
                  elif not stat.S_ISDIR(entry.st_mode):
                      raise SystemExit(f"{label} traverses a non-directory")
              if path.resolve(strict=True) != cursor:
                  raise SystemExit(f"{label} resolves outside its lexical candidate path")

          local_packages = [package for package in packages if package.get("source") is None]
          if not local_packages:
              raise SystemExit("Cargo metadata contains no local packages")
          for package in local_packages:
              require_rooted_regular(package.get("manifest_path"), "local package manifest")
              targets = package.get("targets")
              if not isinstance(targets, list) or not targets:
                  raise SystemExit("local package has no Cargo targets")
              for target in targets:
                  if not isinstance(target, dict):
                      raise SystemExit("local package target is not an object")
                  require_rooted_regular(target.get("src_path"), "local package target")
          PY
            jq -e '
              (.packages | type == "array" and length > 0 and length <= 512)
              and all(.packages[];
                ((.source == null) or (.source | type == "string"))
                and (.version | type == "string")
              )
            ' "$metadata" >/dev/null
            versions=$(jq -r \
              '.packages[] | select(.source == null) | .version' "$metadata" \
              | LC_ALL=C sort -u)
            test "$(printf '%s\n' "$versions" \
              | awk 'NF { count += 1 } END { print count + 0 }')" -eq 1
            test "$versions" = "${{ steps.metadata.outputs.version }}"
          }
          if [[ "$previous" == BOOTSTRAP ]]; then
            # With no predecessor, first-release policy necessarily trusts the
            # candidate, but confines its Cargo process to the detached tree and
            # an isolated target directory. This path exists only for the
            # project's fixed first public version and cannot be reused if
            # predecessor selection ever regresses.
            test "$GITHUB_REF_NAME" = v0.0.1
            test "${{ steps.metadata.outputs.version }}" = 0.0.1
            jq -e '
              [
                .[][]
                | select(.draft == false and .prerelease == false)
                | select(
                    .tag_name
                    | type == "string"
                      and test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
                  )
              ]
              | length == 0
            ' "$releases" >/dev/null
            (
              cd "$candidate_root"
              CARGO_TARGET_DIR="$RUNNER_TEMP/core-schema-bootstrap-target" \
                cargo +"$RUST_VERSION" run --locked -p iteron-xtask -- \
                  schema-compat check-bootstrap
            )
            validate_cargo_workspace_versions
            git -C "$candidate_root" status \
              --porcelain=v1 -z --untracked-files=all > "$candidate_status"
            test ! -s "$candidate_status"
            test "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')" = \
              "${{ steps.metadata.outputs.commit }}"
            test "$(git rev-parse 'HEAD^{commit}')" = \
              "${{ steps.metadata.outputs.commit }}"
            workspace_status=$RUNNER_TEMP/core-release-workspace-status
            git status --porcelain=v1 -z --untracked-files=all > "$workspace_status"
            test ! -s "$workspace_status"
            exit 0
          fi

          [[ "$previous" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$previous")" = tag
          previous_commit=$(git rev-parse "refs/tags/$previous^{commit}")
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "$previous_commit" \
            "${{ steps.metadata.outputs.commit }}"
          gh release verify "$previous" --repo "$GITHUB_REPOSITORY"

          policy_root=$RUNNER_TEMP/core-schema-policy-base
          policy_target=$RUNNER_TEMP/core-schema-policy-target
          git worktree add --detach "$policy_root" "$previous_commit"
          trusted_previous=$(python3 \
            "$policy_root/release-tools/schema_release.py" \
            --input "$releases" \
            --candidate "$GITHUB_REF_NAME")
          test "$trusted_previous" = "$previous"
          (
            cd "$policy_root"
            CARGO_TARGET_DIR="$policy_target" \
              cargo +"$RUST_VERSION" build --locked -p iteron-xtask
          )
          "$policy_target/debug/iteron-xtask" \
            --repo "$candidate_root" \
            schema-compat check-release --base "$previous_commit"
          validate_cargo_workspace_versions
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          test ! -s "$candidate_status"
          test "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')" = \
            "${{ steps.metadata.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "${{ steps.metadata.outputs.commit }}"
          workspace_status=$RUNNER_TEMP/core-release-workspace-status
          git status --porcelain=v1 -z --untracked-files=all > "$workspace_status"
          test ! -s "$workspace_status"
      # Ubuntu 24.04 restricts unprivileged user namespaces unless the invoking program has an
      # explicit AppArmor profile. Attach permission only to the fixed system bwrap path; never
      # disable the host-wide user namespace restriction.
      - name: Install and authorize the bubblewrap boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: Validate release tooling
        run: release-tools/validate.sh
      - name: Validate ownership and dependency contract
        run: cargo +"$RUST_VERSION" run --locked -p iteron-xtask -- boundaries check
      - name: Format
        run: cargo +"$RUST_VERSION" fmt --all -- --check
      - name: Check
        run: cargo +"$RUST_VERSION" check --workspace --all-targets --locked
      - name: Clippy
        run: cargo +"$RUST_VERSION" clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +"$RUST_VERSION" test --workspace --all-targets --locked

  legal:
    name: release / legal evidence
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Fetch locked dependency sources
        run: cargo +"$RUST_VERSION" fetch --locked
      - name: Fetch the checksum-pinned cargo-about binary
        run: >-
          python3 release-tools/fetch_tool.py cargo-about linux-x86_64
          --output "$RUNNER_TEMP/cargo-about"
      - name: Generate frozen license and notice evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legal"
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --output-file "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            release-tools/about.hbs
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --format json \
            --output-file "$RUNNER_TEMP/cargo-about.json"
          cargo +"$RUST_VERSION" metadata --locked --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc
          do
            cargo +"$RUST_VERSION" tree --locked -p iteron-cli \
              --target "$target" -e normal --prefix none --format '{p}' \
              > "$RUNNER_TEMP/cargo-tree-$target.txt"
          done
          python3 release-tools/legal.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-apple-darwin.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-apple-darwin.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-unknown-linux-musl.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-unknown-linux-musl.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-pc-windows-msvc.txt" \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --inventory "$RUNNER_TEMP/cargo-about.json" \
            --output "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: release / ${{ matrix.target }}
    needs: [validate, legal]
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: darwin-arm64
            target: aarch64-apple-darwin
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
          - runner: macos-15-intel
            host: darwin-x86_64
            target: x86_64-apple-darwin
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
          - runner: ubuntu-24.04-arm
            host: linux-arm64
            target: aarch64-unknown-linux-musl
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
          - runner: ubuntu-24.04
            host: linux-x86_64
            target: x86_64-unknown-linux-musl
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
          - runner: windows-2025
            host: windows-x86_64
            target: x86_64-pc-windows-msvc
            python: python
            tool-suffix: .exe
            archive-suffix: zip
            binary: iteron.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-build
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -C strip=symbols
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Normalize Windows build paths for native tools
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          workspace=$(cygpath -m "$GITHUB_WORKSPACE")
          {
            echo "CARGO_TARGET_DIR=$workspace/target/release-build"
            echo "RUSTFLAGS=--remap-path-prefix=$workspace=/workspace -C strip=symbols"
          } >> "$GITHUB_ENV"
      # Keep this identical to CI's narrow Ubuntu 24.04 bwrap authorization. The profile grants
      # user namespaces only to the root-owned system binary and leaves the global restriction on.
      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap musl-tools
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: Install the pinned Rust target
        shell: bash
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --target "${{ matrix.target }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal
      - name: Fetch checksum-pinned build and SBOM tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-bin"
          "${{ matrix.python }}" release-tools/fetch_tool.py cargo-auditable "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/cargo-auditable${{ matrix.tool-suffix }}"
          "${{ matrix.python }}" release-tools/fetch_tool.py syft "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/syft${{ matrix.tool-suffix }}"
          echo "$RUNNER_TEMP/release-bin" >> "$GITHUB_PATH"
      - name: Run the complete target test suite
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: >-
          cargo +"$RUST_VERSION" test
          --workspace --all-targets --locked
          --target "${{ matrix.target }}"
      - name: Run the bounded Windows one-shot compatibility test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo +"$RUST_VERSION" test
          --locked -p iteron-cli --bin iteron
          --target "${{ matrix.target }}"
          output::tests::explicit_v4_projection_preserves_the_frozen_terminal_bytes
      # Stamp the build identity INTO the binary. Two artifacts cut from different commits both
      # reported `iteron 0.0.1`, so a user could not tell which one they had and an aged binary had
      # no way to say so. `--version` carries these; `-V` stays the bare semver matched below.
      - name: Build an auditable release binary
        shell: bash
        env:
          ITERON_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          # Derived from SOURCE_DATE_EPOCH, not the wall clock, so the stamp stays reproducible.
          # `date -d @` is GNU-only and this matrix includes macOS; python3 is on both runners.
          ITERON_BUILD_DATE=$(python3 -c 'import os, time; print(time.strftime("%Y-%m-%d", time.gmtime(int(os.environ["SOURCE_DATE_EPOCH"]))))')
          export ITERON_BUILD_DATE
          cargo +"$RUST_VERSION" auditable build \
            --release --locked -p iteron-cli \
            --target "${{ matrix.target }}"
      - name: Verify architecture, linkage, and executable smoke tests
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          target=${{ matrix.target }}
          test -x "$binary"
          test "$("$binary" -V)" = "iteron ${{ needs.validate.outputs.version }}"
          long_version=$("$binary" --version)
          grep -q "${{ needs.validate.outputs.commit }}" <<<"$long_version"
          grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$long_version"
          "$binary" --help >/dev/null
          "$binary" --machine-contract > "$RUNNER_TEMP/MACHINE-CONTRACT.json"
          jq -e '
            .schema_version == 1
            and .type == "machine_contract"
            and (.cli_stream_versions | index(4)) != null
            and (.default_cli_stream_version | type) == "number"
            and (.resident_protocol_version | type) == "number"
          ' "$RUNNER_TEMP/MACHINE-CONTRACT.json" >/dev/null
          description=$(file "$binary")
          case "$target" in
            aarch64-apple-darwin) grep -q 'arm64' <<<"$description" ;;
            x86_64-apple-darwin) grep -q 'x86_64' <<<"$description" ;;
            aarch64-unknown-linux-musl) grep -Eq 'ARM aarch64|aarch64' <<<"$description" ;;
            x86_64-unknown-linux-musl) grep -q 'x86-64' <<<"$description" ;;
          esac
          if [[ "$target" == *-unknown-linux-musl ]]; then
            grep -Eq 'statically linked|static-pie linked' <<<"$description"
          fi
      - name: Verify native Windows PE and schema-v4 capability
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}/release/${{ matrix.binary }}"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "iteron.exe missing" }
          $header = [System.IO.File]::ReadAllBytes($binary)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "iteron.exe is not a PE image"
          }
          if ((& $binary --version) -ne "iteron ${{ needs.validate.outputs.version }}") {
            throw "iteron.exe reported the wrong version"
          }
          & $binary --help | Out-Null
          $contractPath = Join-Path $env:RUNNER_TEMP "MACHINE-CONTRACT.json"
          & $binary --machine-contract | Out-File -LiteralPath $contractPath -Encoding utf8NoBOM
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          if ($contract.schema_version -ne 1 -or $contract.type -ne "machine_contract") {
            throw "iteron.exe returned the wrong capability schema"
          }
          if (-not ($contract.cli_stream_versions -contains 4)) {
            throw "iteron.exe does not retain CLI stream schema 4"
          }
      - name: Complete one task with the native release client
        id: native-client
        run: >-
          "${{ matrix.python }}" -I release-tools/smoke_release_client.py
          --binary "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Run native version-independence proof
        id: native-version-independence
        if: >-
          success() &&
          (matrix.target == 'x86_64-unknown-linux-musl' ||
          matrix.target == 'x86_64-pc-windows-msvc')
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          max_log_bytes=1048576

          run_exact() {
            label=$1
            shift
            log="$RUNNER_TEMP/core-native-version-$label.log"
            test ! -e "$log"
            set +e
            "$@" 2>&1 | head -c "$((max_log_bytes + 1))" > "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            test "${#pipeline_status[@]}" -eq 2
            status=${pipeline_status[0]}
            capture_status=${pipeline_status[1]}
            test "$capture_status" -eq 0
            bytes=$(wc -c < "$log" | tr -d '[:space:]')
            [[ "$bytes" =~ ^[0-9]+$ ]]
            if [[ "$bytes" -gt "$max_log_bytes" ]]; then
              printf 'native version proof %s exceeded %s bytes\n' \
                "$label" "$max_log_bytes" >&2
              exit 1
            fi
            cat "$log"
            test "$status" -eq 0
            summaries=$(grep -Ec \
              '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$' \
              "$log" || true)
            test "$summaries" -eq 1
          }

          run_exact tui \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli --bin iteron \
              --target "$target" \
              tui::app_server::tests::version_skew_is_refused_up_front -- --exact
          run_exact one-shot \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli \
              --test one_shot_output --target "$target" \
              one_shot_refuses_app_server_version_skew_before_provider_dispatch \
              -- --exact
          run_exact headless \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli \
              --test headless_serve --target "$target" \
              no_tty_skew_reconnect_and_result_v5_share_one_headless_server \
              -- --exact
          if [[ "$target" == x86_64-pc-windows-msvc ]]; then
            run_exact conpty \
              cargo +"$RUST_VERSION" test --locked -p iteron-cli \
                --test windows_conpty --target "$target" \
                native_conpty_rejects_version_skew_before_terminal_takeover \
                -- --exact
          fi
      - name: Generate and normalize the binary SBOM
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p dist
          syft scan "$binary" -o "spdx-json=$RUNNER_TEMP/raw.spdx.json"
          "${{ matrix.python }}" release-tools/sbom.py \
            --input "$RUNNER_TEMP/raw.spdx.json" \
            --binary "$binary" \
            --output "$RUNNER_TEMP/SBOM.spdx.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Package the deterministic release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          "${{ matrix.python }}" release-tools/manifest.py build-info \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --rustc "$(rustc +"$RUST_VERSION" --version --verbose)" \
            --cargo "$(cargo +"$RUST_VERSION" --version)" \
            --output "$RUNNER_TEMP/BUILD-INFO.json"
          "${{ matrix.python }}" release-tools/package.py \
            --binary "$binary" \
            --license LICENSE \
            --readme README.md \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --notices "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt" \
            --sbom "$RUNNER_TEMP/SBOM.spdx.json" \
            --build-info "$RUNNER_TEMP/BUILD-INFO.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-dir dist
          archive_name="iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}"
          cp "$RUNNER_TEMP/SBOM.spdx.json" "dist/$archive_name.spdx.json"
          cp "$RUNNER_TEMP/MACHINE-CONTRACT.json" "dist/$archive_name.machine-contract.json"
          echo "archive=dist/$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive-name=$archive_name" >> "$GITHUB_OUTPUT"
      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
      - name: Generate signed SBOM attestation
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
          sbom-path: ${{ runner.temp }}/SBOM.spdx.json
      - name: Materialize offline attestation bundles
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive-name }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: release / publish immutable assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, legal, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # The Actions token cannot read the administration-only immutable-releases endpoint.
      # Owner approval on this environment and this externally audited repository variable are
      # both required before any release mutation. Publishing still fails unless the ordinary
      # release API reports the resulting release as immutable.
      - name: Require the externally audited immutable-release control
        env:
          RELEASE_IMMUTABLE_CONFIRMED: ${{ vars.RELEASE_IMMUTABLE_CONFIRMED }}
        run: test "$RELEASE_IMMUTABLE_CONFIRMED" = true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-release-*
          path: dist
          merge-multiple: true
      - name: Render release metadata
        run: |
          set -euo pipefail
          python3 release-tools/render_installer.py \
            --template install.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --output dist/install.sh
          python3 release-tools/manifest.py release \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --dist dist \
            --protocol-source crates/protocol/src/wire.rs \
            --output dist/release-manifest.json \
            --receipt dist/release-manifest.receipt.json
          python3 release-tools/checksums.py \
            --dist dist \
            --output dist/SHA256SUMS
      - name: Sign release metadata
        id: metadata-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ github.workspace }}/dist/install.sh
            ${{ github.workspace }}/dist/release-manifest.json
            ${{ github.workspace }}/dist/release-manifest.receipt.json
            ${{ github.workspace }}/dist/SHA256SUMS
      - name: Materialize metadata attestation bundle
        shell: bash
        run: >-
          cp "${{ steps.metadata-attestation.outputs.bundle-path }}"
          dist/release-metadata.provenance.json
      - name: Publish the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_version=2026-03-10
          created_release_id=
          published=false
          cleanup_workflow_draft() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$published" != true \
              && "$created_release_id" =~ ^[0-9]+$ ]]; then
              set +e
              cleanup_json=$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/releases/$created_release_id" 2>/dev/null)
              if [[ "$(jq -r '.id // empty' <<<"$cleanup_json")" = "$created_release_id" \
                && "$(jq -r '.tag_name // empty' <<<"$cleanup_json")" = "$GITHUB_REF_NAME" \
                && "$(jq -r '.draft // empty' <<<"$cleanup_json")" = true ]]; then
                gh api --method DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
                printf 'removed workflow-owned failed draft release id %s\n' \
                  "$created_release_id" >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_workflow_draft EXIT

          expected_commit=${{ needs.validate.outputs.commit }}
          [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
          remote_tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_REF" = "$remote_tag_ref"
          verify_remote_annotated_tag() {
            stage=$1
            [[ "$stage" =~ ^[a-z-]+$ ]]
            verification_ref="refs/core-release-verification/$stage"
            git fetch --force --no-tags origin \
              "$remote_tag_ref:$verification_ref"
            test "$(git cat-file -t "$verification_ref")" = tag
            remote_commit=$(git rev-parse "$verification_ref^{commit}")
            test "$remote_commit" = "$expected_commit"
          }

          # Re-read the remote ref immediately before the first release mutation.
          # Repository tag protection remains the external atomicity boundary.
          verify_remote_annotated_tag pre-create

          existing_release_ids=$(gh api --paginate \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            printf 'release already exists; refusing to replace a published or draft release\n' >&2
            exit 1
          fi

          release_json=$RUNNER_TEMP/release.json
          gh api --method POST \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Iteron ${{ needs.validate.outputs.version }}" \
            -F draft=true \
            -F generate_release_notes=true > "$release_json"
          created_release_id=$(jq -r '.id // empty' "$release_json")
          [[ "$created_release_id" =~ ^[0-9]+$ ]]
          printf 'created workflow-owned draft release id %s\n' "$created_release_id"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

          verified=false
          for _ in $(seq 1 12); do
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" > "$release_json"
            test "$(jq -r .id "$release_json")" = "$created_release_id"
            local_count=$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
            remote_count=$(jq '.assets | length' "$release_json")
            if [[ "$local_count" != "$remote_count" ]]; then
              sleep 2
              continue
            fi
            verified=true
            while IFS= read -r asset; do
              name=${asset##*/}
              expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              actual=$(jq -r --arg name "$name" \
                '[.assets[] | select(.name == $name) | .digest] | if length == 1 then .[0] else "" end' \
                "$release_json")
              if [[ "$actual" != "$expected" ]]; then
                verified=false
                break
              fi
            done < <(find dist -maxdepth 1 -type f | LC_ALL=C sort)
            [[ "$verified" == true ]] && break
            sleep 2
          done
          [[ "$verified" == true ]]

          # Uploading a draft can take minutes. Refuse publication if the remote
          # annotated tag disappeared or moved during that window.
          verify_remote_annotated_tag pre-publish
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            -F draft=false \
            -f make_latest=true > "$release_json"
          test "$(jq -r .id "$release_json")" = "$created_release_id"
          test "$(jq -r .draft "$release_json")" = false
          published=true

          immutable_release=false
          for _ in $(seq 1 6); do
            immutable_release=$(gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" --jq .immutable)
            [[ "$immutable_release" == true ]] && break
            sleep 2
          done
          if [[ "$immutable_release" != true ]]; then
            printf 'release id %s is mutable; deleting only this workflow-created release\n' \
              "$created_release_id" >&2
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
            printf 'deleted workflow-created mutable release id %s; tag was preserved\n' \
              "$created_release_id" >&2
            exit 1
          fi

          release_verified=false
          for _ in $(seq 1 12); do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              release_verified=true
              break
            fi
            sleep 5
          done
          [[ "$release_verified" == true ]]

          shopt -s nullglob
          for archive in dist/iteron-v*.tar.gz dist/iteron-v*.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners
          done

  content-canary:
    name: release / content canary / ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            archive-suffix: tar.gz
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive-suffix: tar.gz
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive-suffix: tar.gz
            python: python3
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive-suffix: tar.gz
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive-suffix: zip
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Download, content-verify, extract, and smoke the exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/core-content-canary"
          mkdir -p "$canary/download" "$canary/extract"
          archive="iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}"
          report="$archive.machine-contract.json"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json \
            --pattern release-manifest.receipt.json \
            --pattern "$archive" \
            --pattern "$report" \
            --dir "$canary/download"
          binary=$("${{ matrix.python }}" release-tools/verify_release.py artifact \
            --manifest "$canary/download/release-manifest.json" \
            --receipt "$canary/download/release-manifest.receipt.json" \
            --archive "$canary/download/$archive" \
            --capability-report "$canary/download/$report" \
            --target "${{ matrix.target }}" \
            --extract-dir "$canary/extract")
          test "$("$binary" --version)" = "iteron ${{ needs.validate.outputs.version }}"
          "$binary" --machine-contract > "$canary/live-machine-contract.json"
          "${{ matrix.python }}" release-tools/verify_release.py contract \
            --manifest "$canary/download/release-manifest.json" \
            --report "$canary/live-machine-contract.json"
      - name: Verify the latest Windows archive redirect
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}"
          $exactArchive = Join-Path $env:RUNNER_TEMP "core-content-canary/download/$archiveName"
          if (-not (Test-Path -LiteralPath $exactArchive)) {
            throw "content-verified Windows archive missing at $exactArchive"
          }
          $archive = Join-Path $env:RUNNER_TEMP 'iteron-latest.zip'
          curl.exe --proto '=https' --tlsv1.2 -LsSf --retry 6 --retry-all-errors `
            --retry-delay 2 `
            "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$archiveName" `
            -o $archive
          if ($LASTEXITCODE -ne 0) { throw "latest Windows archive download exited with $LASTEXITCODE" }
          $latestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          $exactHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exactArchive).Hash
          if ($latestHash -ne $exactHash) {
            throw 'latest Windows archive does not match the content-verified tag archive'
          }

  curl-canary:
    name: release / curl canary / ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the exact public release through curl
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/iteron-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
            | sh -s -- --version "$GITHUB_REF_NAME" --bin-dir "$bin_dir"
          test "$("$bin_dir/core" -V)" = "iteron ${{ needs.validate.outputs.version }}"
      - name: Verify the latest installer redirect
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/iteron-latest-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
            | sh -s -- --bin-dir "$bin_dir"
          test "$("$bin_dir/core" -V)" = "iteron ${{ needs.validate.outputs.version }}"
