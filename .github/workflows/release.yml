name: release

on:
  push:
    tags:
      - "v*"
  # Run the complete validation/legal/native-build/package graph on any selected
  # commit without creating a release. Publish and curl canaries remain tag-only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize every release candidate so two immutable tags cannot race to
  # publish or replace the repository's `latest` release pointer.
  group: core-code-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.90.0
  # cargo-about invokes Cargo as a child process, so pin the ambient rustup
  # selection in addition to explicit `cargo +VERSION` workflow commands.
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  validate:
    name: release / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      source-date-epoch: ${{ steps.metadata.outputs.source-date-epoch }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --component clippy
          --component rustfmt
      - name: Validate version and release source commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          versions=$(cargo +"$RUST_VERSION" metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.source == null) | .version' \
            | LC_ALL=C sort -u)
          test "$(printf '%s\n' "$versions" | awk 'NF { count += 1 } END { print count + 0 }')" -eq 1
          version=$versions

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            test "$tag_commit" = "$event_commit"
            test "$tag" = "v$version"
            git fetch --no-tags origin main
            main_commit=$(git rev-parse 'origin/main^{commit}')
            test "$tag_commit" = "$main_commit"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            tag_commit=$event_commit
          fi

          epoch=$(git show -s --format=%ct "$tag_commit")
          test "$epoch" -ge 0
          {
            echo "commit=$tag_commit"
            echo "source-date-epoch=$epoch"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      # Ubuntu 24.04 restricts unprivileged user namespaces unless the invoking program has an
      # explicit AppArmor profile. Attach permission only to the fixed system bwrap path; never
      # disable the host-wide user namespace restriction.
      - name: Install and authorize the bubblewrap boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: Validate release tooling
        run: release-tools/validate.sh
      - name: Validate ownership and dependency contract
        run: cargo +"$RUST_VERSION" run --locked -p core-xtask -- boundaries check
      - name: Format
        run: cargo +"$RUST_VERSION" fmt --all -- --check
      - name: Check
        run: cargo +"$RUST_VERSION" check --workspace --all-targets --locked
      - name: Clippy
        run: cargo +"$RUST_VERSION" clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +"$RUST_VERSION" test --workspace --all-targets --locked

  legal:
    name: release / legal evidence
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Fetch locked dependency sources
        run: cargo +"$RUST_VERSION" fetch --locked
      - name: Fetch the checksum-pinned cargo-about binary
        run: >-
          python3 release-tools/fetch_tool.py cargo-about linux-x86_64
          --output "$RUNNER_TEMP/cargo-about"
      - name: Generate frozen license and notice evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legal"
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --output-file "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            release-tools/about.hbs
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --format json \
            --output-file "$RUNNER_TEMP/cargo-about.json"
          cargo +"$RUST_VERSION" metadata --locked --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl
          do
            cargo +"$RUST_VERSION" tree --locked -p core-cli \
              --target "$target" -e normal --prefix none --format '{p}' \
              > "$RUNNER_TEMP/cargo-tree-$target.txt"
          done
          python3 release-tools/legal.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-apple-darwin.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-apple-darwin.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-unknown-linux-musl.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-unknown-linux-musl.txt" \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --inventory "$RUNNER_TEMP/cargo-about.json" \
            --output "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: release / ${{ matrix.target }}
    needs: [validate, legal]
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host: darwin-arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            host: darwin-x86_64
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            host: linux-arm64
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            host: linux-x86_64
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-build
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -C strip=symbols
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Keep this identical to CI's narrow Ubuntu 24.04 bwrap authorization. The profile grants
      # user namespaces only to the root-owned system binary and leaves the global restriction on.
      - name: Install Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap musl-tools
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: Install the pinned Rust target
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --target "${{ matrix.target }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal
      - name: Fetch checksum-pinned build and SBOM tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-bin"
          python3 release-tools/fetch_tool.py cargo-auditable "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/cargo-auditable"
          python3 release-tools/fetch_tool.py syft "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/syft"
          echo "$RUNNER_TEMP/release-bin" >> "$GITHUB_PATH"
      - name: Run the complete target test suite
        run: >-
          cargo +"$RUST_VERSION" test
          --workspace --all-targets --locked
          --target "${{ matrix.target }}"
      - name: Build an auditable release binary
        run: >-
          cargo +"$RUST_VERSION" auditable build
          --release --locked -p core-cli
          --target "${{ matrix.target }}"
      - name: Verify architecture, linkage, and executable smoke tests
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/core"
          target=${{ matrix.target }}
          test -x "$binary"
          test "$("$binary" --version)" = "core ${{ needs.validate.outputs.version }}"
          "$binary" --help >/dev/null
          description=$(file "$binary")
          case "$target" in
            aarch64-apple-darwin) grep -q 'arm64' <<<"$description" ;;
            x86_64-apple-darwin) grep -q 'x86_64' <<<"$description" ;;
            aarch64-unknown-linux-musl) grep -Eq 'ARM aarch64|aarch64' <<<"$description" ;;
            x86_64-unknown-linux-musl) grep -q 'x86-64' <<<"$description" ;;
          esac
          if [[ "$target" == *-unknown-linux-musl ]]; then
            grep -Eq 'statically linked|static-pie linked' <<<"$description"
          fi
      - name: Generate and normalize the binary SBOM
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/core"
          mkdir -p dist
          syft scan "$binary" -o "spdx-json=$RUNNER_TEMP/raw.spdx.json"
          python3 release-tools/sbom.py \
            --input "$RUNNER_TEMP/raw.spdx.json" \
            --binary "$binary" \
            --output "$RUNNER_TEMP/SBOM.spdx.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Package the deterministic release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/core"
          python3 release-tools/manifest.py build-info \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --rustc "$(rustc +"$RUST_VERSION" --version --verbose)" \
            --cargo "$(cargo +"$RUST_VERSION" --version)" \
            --output "$RUNNER_TEMP/BUILD-INFO.json"
          python3 release-tools/package.py \
            --binary "$binary" \
            --license LICENSE \
            --readme README.md \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --notices "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt" \
            --sbom "$RUNNER_TEMP/SBOM.spdx.json" \
            --build-info "$RUNNER_TEMP/BUILD-INFO.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-dir dist
          archive_name="core-code-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
          cp "$RUNNER_TEMP/SBOM.spdx.json" "dist/$archive_name.spdx.json"
          echo "archive=dist/$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive-name=$archive_name" >> "$GITHUB_OUTPUT"
      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
      - name: Generate signed SBOM attestation
        id: sbom-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
          sbom-path: ${{ runner.temp }}/SBOM.spdx.json
      - name: Materialize offline attestation bundles
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive-name }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: release / publish immutable assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, legal, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # The Actions token cannot read the administration-only immutable-releases endpoint.
      # Owner approval on this environment and this externally audited repository variable are
      # both required before any release mutation. Publishing still fails unless the ordinary
      # release API reports the resulting release as immutable.
      - name: Require the externally audited immutable-release control
        env:
          RELEASE_IMMUTABLE_CONFIRMED: ${{ vars.RELEASE_IMMUTABLE_CONFIRMED }}
        run: test "$RELEASE_IMMUTABLE_CONFIRMED" = true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-release-*
          path: dist
          merge-multiple: true
      - name: Render release metadata
        run: |
          set -euo pipefail
          python3 release-tools/render_installer.py \
            --template install.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --output dist/install.sh
          python3 release-tools/manifest.py release \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --dist dist \
            --output dist/release-manifest.json
          python3 release-tools/checksums.py \
            --dist dist \
            --output dist/SHA256SUMS
      - name: Sign release metadata
        id: metadata-attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ github.workspace }}/dist/install.sh
            ${{ github.workspace }}/dist/release-manifest.json
            ${{ github.workspace }}/dist/SHA256SUMS
      - name: Materialize metadata attestation bundle
        run: >-
          cp "${{ steps.metadata-attestation.outputs.bundle-path }}"
          dist/release-metadata.provenance.json
      - name: Publish the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_version=2026-03-10
          created_release_id=
          published=false
          cleanup_workflow_draft() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$published" != true \
              && "$created_release_id" =~ ^[0-9]+$ ]]; then
              set +e
              cleanup_json=$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/releases/$created_release_id" 2>/dev/null)
              if [[ "$(jq -r '.id // empty' <<<"$cleanup_json")" = "$created_release_id" \
                && "$(jq -r '.tag_name // empty' <<<"$cleanup_json")" = "$GITHUB_REF_NAME" \
                && "$(jq -r '.draft // empty' <<<"$cleanup_json")" = true ]]; then
                gh api --method DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
                printf 'removed workflow-owned failed draft release id %s\n' \
                  "$created_release_id" >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_workflow_draft EXIT

          existing_release_ids=$(gh api --paginate \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            printf 'release already exists; refusing to replace a published or draft release\n' >&2
            exit 1
          fi

          release_json=$RUNNER_TEMP/release.json
          gh api --method POST \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Core Code ${{ needs.validate.outputs.version }}" \
            -F draft=true \
            -F generate_release_notes=true > "$release_json"
          created_release_id=$(jq -r '.id // empty' "$release_json")
          [[ "$created_release_id" =~ ^[0-9]+$ ]]
          printf 'created workflow-owned draft release id %s\n' "$created_release_id"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

          verified=false
          for _ in $(seq 1 12); do
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" > "$release_json"
            test "$(jq -r .id "$release_json")" = "$created_release_id"
            local_count=$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
            remote_count=$(jq '.assets | length' "$release_json")
            if [[ "$local_count" != "$remote_count" ]]; then
              sleep 2
              continue
            fi
            verified=true
            while IFS= read -r asset; do
              name=${asset##*/}
              expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              actual=$(jq -r --arg name "$name" \
                '[.assets[] | select(.name == $name) | .digest] | if length == 1 then .[0] else "" end' \
                "$release_json")
              if [[ "$actual" != "$expected" ]]; then
                verified=false
                break
              fi
            done < <(find dist -maxdepth 1 -type f | LC_ALL=C sort)
            [[ "$verified" == true ]] && break
            sleep 2
          done
          [[ "$verified" == true ]]

          gh api --method PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            -F draft=false \
            -f make_latest=true > "$release_json"
          test "$(jq -r .id "$release_json")" = "$created_release_id"
          test "$(jq -r .draft "$release_json")" = false
          published=true

          immutable_release=false
          for _ in $(seq 1 6); do
            immutable_release=$(gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" --jq .immutable)
            [[ "$immutable_release" == true ]] && break
            sleep 2
          done
          if [[ "$immutable_release" != true ]]; then
            printf 'release id %s is mutable; deleting only this workflow-created release\n' \
              "$created_release_id" >&2
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
            printf 'deleted workflow-created mutable release id %s; tag was preserved\n' \
              "$created_release_id" >&2
            exit 1
          fi

          release_verified=false
          for _ in $(seq 1 12); do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              release_verified=true
              break
            fi
            sleep 5
          done
          [[ "$release_verified" == true ]]

          for archive in dist/core-code-v*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners
          done

  curl-canary:
    name: release / curl canary / ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the exact public release through curl
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/core-code-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
            | sh -s -- --version "$GITHUB_REF_NAME" --bin-dir "$bin_dir"
          test "$("$bin_dir/core" --version)" = "core ${{ needs.validate.outputs.version }}"
      - name: Verify the latest installer redirect
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/core-code-latest-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
            | sh -s -- --bin-dir "$bin_dir"
          test "$("$bin_dir/core" --version)" = "core ${{ needs.validate.outputs.version }}"
