name: release

on:
  push:
    tags:
      - "v*"
  # Run the complete validation/legal/native-build/package graph on any selected ref.
  # Branch dispatches never publish; an immutable v* tag dispatch may publish and canary.
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Serialize every release candidate so two immutable tags cannot race to
  # publish or replace the repository's `latest` release pointer.
  group: iteron-release
  queue: max
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_CLI_LINUX_ARM64_SHA256: 73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5
  GH_CLI_VERSION: 2.97.0
  RUST_VERSION: 1.90.0
  # cargo-about invokes Cargo as a child process, so pin the ambient rustup
  # selection in addition to explicit `cargo +VERSION` workflow commands.
  RUSTUP_TOOLCHAIN: 1.90.0

jobs:
  validate:
    name: release / validate
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      source-date-epoch: ${{ steps.metadata.outputs.source-date-epoch }}
      tree: ${{ steps.metadata.outputs.tree }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --component clippy
          --component rustfmt
      - name: Install the pinned GitHub CLI with release verification support
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "$RUNNER_TEMP/iteron-gh-cli.XXXXXX")
          archive=$tool_root/gh.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$GH_CLI_LINUX_ARM64_SHA256" "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$tool_root"
          gh_root=$tool_root/gh_${GH_CLI_VERSION}_linux_arm64
          test -x "$gh_root/bin/gh"
          "$gh_root/bin/gh" release verify --help >/dev/null
          echo "$gh_root/bin" >> "$GITHUB_PATH"
      - name: Validate version and release source commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            printf 'release validation failed: %s\n' "$*" >&2
            exit 1
          }

          require_eq() {
            local description=$1 expected=$2 actual=$3
            if [[ "$expected" != "$actual" ]]; then
              printf 'release validation failed: %s\n  expected: %q\n  actual:   %q\n' "$description" "$expected" "$actual" >&2
              exit 1
            fi
          }

          require_match() {
            local description=$1 regex=$2 value=$3
            if [[ ! "$value" =~ $regex ]]; then
              printf 'release validation failed: %s\n  value: %q\n  regex:  %q\n' "$description" "$value" "$regex" >&2
              exit 1
            fi
          }

          require_not_exists() {
            local description=$1 path=$2
            if [[ -e "$path" ]]; then
              printf 'release validation failed: %s\n  path should not exist: %q\n' "$description" "$path" >&2
              exit 1
            fi
          }

          require_empty() {
            local description=$1 path=$2
            if [[ -s "$path" ]]; then
              printf 'release validation failed: %s\n  file should be empty: %q\n' "$description" "$path" >&2
              exit 1
            fi
          }

          require_true() {
            local description=$1
            shift
            if ! "$@"; then
              printf 'release validation failed: %s\n' "$description" >&2
              exit 1
            fi
          }

          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            require_match "tag name must be a strict semantic version" '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' "$tag"
            tag_type=$(git cat-file -t "refs/tags/$tag")
            if [[ "$tag_type" != tag ]]; then
              printf 'release validation failed: refs/tags/%s is a %s tag, but releases require an annotated tag\n' "$tag" "$tag_type" >&2
              printf 'To fix, delete the lightweight tag and recreate it as annotated:\n' >&2
              printf '  git tag -d %s\n' "$tag" >&2
              printf '  git tag -a %s -m "Iteron %s"\n' "$tag" "${tag#v}" >&2
              printf '  git push origin %s --force-with-lease\n' "$tag" >&2
              printf 'Then re-run the release workflow.\n' >&2
              exit 1
            fi
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            require_eq "annotated tag refs/tags/$tag must resolve to the workflow event commit" "$event_commit" "$tag_commit"
            git fetch --no-tags origin main
            main_commit=$(git rev-parse 'origin/main^{commit}')
            require_eq "annotated tag refs/tags/$tag must point to the current origin/main" "$tag_commit" "$main_commit"
          else
            require_eq "release must be triggered by a v* tag or workflow_dispatch" "workflow_dispatch" "$GITHUB_EVENT_NAME"
            tag_commit=$event_commit
          fi

          require_match "tag commit must be a 40-character hex SHA" '^[0-9a-f]{40}$' "$tag_commit"
          tested_tree=$(git rev-parse "$tag_commit^{tree}")
          require_match "source tree must be a 40-character hex SHA" '^[0-9a-f]{40}$' "$tested_tree"
          candidate_root=$RUNNER_TEMP/core-schema-candidate
          # RUNNER_TEMP is cleared between jobs, but Git retains auxiliary
          # worktree registrations in this persistent DGX checkout.
          git worktree prune --expire now
          require_not_exists "candidate worktree directory must not already exist" "$candidate_root"
          git worktree add --detach "$candidate_root" "$tag_commit"
          require_eq "candidate worktree HEAD must match the selected commit" "$tag_commit" "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')"
          candidate_status=$RUNNER_TEMP/core-schema-candidate-status
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          require_empty "candidate worktree must be clean" "$candidate_status"

          # Do not invoke Cargo or any repository script before the immutable
          # predecessor validates this detached tree. Even `cargo metadata` can
          # execute a candidate-controlled rustc-wrapper from .cargo/config.toml.
          root_manifest=$candidate_root/Cargo.toml
          require_true "root Cargo.toml must exist" test -f "$root_manifest"
          require_true "root Cargo.toml must not be a symbolic link" test '!' -L "$root_manifest"
          root_manifest_size=$(stat --format='%s' -- "$root_manifest")
          require_match "root Cargo.toml size must be numeric" '^[0-9]+$' "$root_manifest_size"
          if [[ "$root_manifest_size" -gt 65536 ]]; then
            fail "root Cargo.toml must be no larger than 65536 bytes (actual: $root_manifest_size)"
          fi
          version=$(python3 -I - "$candidate_root" <<'PY'
          import pathlib
          import re
          import stat
          import sys
          import tomllib

          MAX_MANIFEST_BYTES = 65_536
          MAX_WORKSPACE_MEMBERS = 128

          def load_manifest(path: pathlib.Path, label: str) -> dict:
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_size > MAX_MANIFEST_BYTES:
                  raise SystemExit(f"{label} must be a regular file no larger than 64 KiB")
              with path.open("rb") as handle:
                  document = tomllib.load(handle)
              if not isinstance(document, dict):
                  raise SystemExit(f"{label} must contain a TOML table")
              return document

          candidate_root = pathlib.Path(sys.argv[1])
          document = load_manifest(candidate_root / "Cargo.toml", "root Cargo.toml")
          workspace = document.get("workspace")
          if not isinstance(workspace, dict):
              raise SystemExit("root Cargo.toml must define [workspace]")
          package_defaults = workspace.get("package")
          if not isinstance(package_defaults, dict):
              raise SystemExit("root Cargo.toml must define [workspace.package]")
          version = package_defaults.get("version")
          if not isinstance(version, str) or re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version
          ) is None:
              raise SystemExit("workspace.package.version must be strict numeric SemVer")

          members = workspace.get("members")
          if (
              not isinstance(members, list)
              or not 0 < len(members) <= MAX_WORKSPACE_MEMBERS
              or any(not isinstance(member, str) for member in members)
              or len(set(members)) != len(members)
          ):
              raise SystemExit("workspace.members must be a bounded unique string list")
          package_names = set()
          for member in members:
              if len(member) > 256 or re.fullmatch(
                  r"[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)*",
                  member,
              ) is None or any(part in (".", "..") for part in member.split("/")):
                  raise SystemExit(f"workspace member path is not explicit and safe: {member!r}")
              directory = candidate_root
              for part in member.split("/"):
                  directory /= part
                  metadata = directory.lstat()
                  if not stat.S_ISDIR(metadata.st_mode):
                      raise SystemExit(f"workspace member traverses a non-directory: {member!r}")
              member_document = load_manifest(
                  directory / "Cargo.toml", f"workspace member {member!r} Cargo.toml"
              )
              package = member_document.get("package")
              if not isinstance(package, dict):
                  raise SystemExit(f"workspace member lacks [package]: {member!r}")
              member_version = package.get("version")
              if member_version != {"workspace": True} and member_version != version:
                  raise SystemExit(
                      f"workspace member {member!r} does not inherit the release version"
                  )
              name = package.get("name")
              if not isinstance(name, str) or re.fullmatch(
                  r"[A-Za-z0-9_-]{1,128}", name
              ) is None or name in package_names:
                  raise SystemExit(f"workspace member has an invalid or duplicate name: {member!r}")
              package_names.add(name)
          print(version)
          PY
          )
          require_match "workspace version must be a strict semantic version" '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' "$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            require_eq "tag name must match workspace version" "v$version" "$GITHUB_REF_NAME"
          fi

          epoch=$(git show -s --format=%ct "$tag_commit")
          if [[ "$epoch" -lt 0 ]]; then
            fail "source commit timestamp must be non-negative (actual: $epoch)"
          fi
          {
            echo "commit=$tag_commit"
            echo "source-date-epoch=$epoch"
            echo "tree=$tested_tree"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Require successful protected CI evidence
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate=${{ steps.metadata.outputs.commit }}
          evidence_commit=$candidate
          evidence_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$candidate&per_page=10" \
            | jq -er --arg candidate "$candidate" \
              '[.workflow_runs[] | select(.head_sha == $candidate)] | first | .id')
          if [[ ! "$evidence_run" =~ ^[1-9][0-9]*$ ]]; then
            printf 'release validation failed: CI evidence run ID must be numeric\n  value: %q\n' "$evidence_run" >&2
            exit 1
          fi

          run_json=$RUNNER_TEMP/core-ci-evidence-run.json
          jobs_json=$RUNNER_TEMP/core-ci-evidence-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$evidence_run" > "$run_json"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$evidence_run/jobs?filter=latest&per_page=100" \
            > "$jobs_json"
          if ! jq -e --arg commit "$evidence_commit" '
            .head_sha == $commit
            and .head_branch == "main"
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"
          ' "$run_json" >/dev/null; then
            printf 'release validation failed: CI evidence run %s must be a successful push run on main for commit %s\n' "$evidence_run" "$evidence_commit" >&2
            printf 'run summary from %s:\n' "$run_json" >&2
            jq '{head_sha, head_branch, event, status, conclusion}' "$run_json" >&2 || true
            exit 1
          fi
          if ! jq -e '
            [.jobs[] | select(
              .name == "ci / required"
              and .status == "completed"
              and .conclusion == "success"
            )] | length == 1
          ' "$jobs_json" >/dev/null; then
            printf 'release validation failed: CI evidence run %s must contain exactly one successful "ci / required" job\n' "$evidence_run" >&2
            printf 'jobs summary from %s:\n' "$jobs_json" >&2
            jq '[.jobs[] | {name, status, conclusion}]' "$jobs_json" >&2 || true
            exit 1
          fi
      - name: Validate against the previous immutable schema release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/release-tools/release-helpers.sh"

          api_version=2026-03-10
          pages=$RUNNER_TEMP/core-schema-release-pages.jsonl
          releases=$RUNNER_TEMP/core-schema-releases.json
          : > "$pages"

          # Page 11 is a sentinel: ten full pages are admitted, while a non-empty
          # eleventh page proves that the 1,000-release policy bound was exceeded.
          for page in $(seq 1 11); do
            page_json=$RUNNER_TEMP/core-schema-release-page-$page.json
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
              --jq '[.[] | {tag_name, draft, prerelease, immutable}]' \
              > "$page_json"
            if ! jq -e 'type == "array" and length <= 100' "$page_json" >/dev/null; then
              printf 'release validation failed: GitHub releases page %d response is not a bounded array\n' "$page" >&2
              exit 1
            fi
            count=$(jq -r 'length' "$page_json")
            if [[ "$page" -eq 11 ]]; then
              if [[ "$count" -ne 0 ]]; then
                printf 'release validation failed: published release inventory exceeds the 1,000-release policy limit\n' >&2
                exit 1
              fi
              break
            fi
            jq -c '.' "$page_json" >> "$pages"
            [[ "$count" -eq 100 ]] || break
          done
          jq -s '.' "$pages" > "$releases"

          # Select the proposed anchor without executing any candidate-owned
          # repository code. The selected immutable release then recomputes the
          # answer with its own trusted policy before any candidate build runs.
          previous=$(jq -er --arg candidate "$GITHUB_REF_NAME" '
            def semver:
              capture(
                "^v(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)$"
              )
              | [
                  (.major | tonumber),
                  (.minor | tonumber),
                  (.patch | tonumber)
                ];
            ($candidate | semver) as $candidate_version
            | [
                .[][]
                | if ((.draft | type) != "boolean")
                    or ((.prerelease | type) != "boolean")
                  then error("release lacks typed draft/prerelease state")
                  elif .draft or .prerelease
                  then empty
                  elif (.tag_name | type) != "string"
                  then error("published release lacks a string tag_name")
                  else . as $release
                    | ($release.tag_name | try semver catch null) as $version
                    | select($version != null)
                    | {
                        tag_name: $release.tag_name,
                        immutable: $release.immutable,
                        version: $version
                      }
                  end
              ] as $stable
            | if ($stable | group_by(.version) | any(length > 1))
              then error("published SemVer release is duplicated")
              elif any($stable[]; .version >= $candidate_version)
              then error("published release is not older than candidate")
              elif ($stable | length) == 0
              then "BOOTSTRAP"
              else ($stable | max_by(.version)) as $previous
                | if $previous.immutable != true
                  then error("highest previous release is not immutable")
                  else $previous.tag_name
                  end
              end
          ' "$releases")
          candidate_root=$RUNNER_TEMP/core-schema-candidate
          candidate_status=$RUNNER_TEMP/core-schema-candidate-status
          require_eq "candidate worktree HEAD must match the selected commit" \
            "${{ steps.metadata.outputs.commit }}" \
            "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')"
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          require_empty "candidate worktree must be clean before schema validation" "$candidate_status"
          validate_cargo_workspace_versions() {
            metadata=$RUNNER_TEMP/core-release-cargo-metadata.json
            (
              cd "$candidate_root"
              CARGO_TARGET_DIR="$RUNNER_TEMP/core-schema-metadata-target" \
                cargo +"$RUST_VERSION" metadata --locked --format-version 1
            ) | head -c 8388609 > "$metadata"
            metadata_size=$(stat --format='%s' -- "$metadata")
            require_match "cargo metadata size must be numeric" '^[0-9]+$' "$metadata_size"
            if [[ "$metadata_size" -gt 8388608 ]]; then
              fail "cargo metadata must be no larger than 8388608 bytes (actual: $metadata_size)"
            fi
            python3 -I - "$metadata" "$candidate_root" <<'PY'
          import json
          import pathlib
          import stat
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          candidate_root = pathlib.Path(sys.argv[2]).resolve(strict=True)
          with metadata_path.open("rb") as handle:
              document = json.load(handle)
          packages = document.get("packages")
          if not isinstance(packages, list) or not 0 < len(packages) <= 512:
              raise SystemExit("Cargo metadata package inventory is not bounded")

          def require_rooted_regular(raw: object, label: str) -> None:
              if not isinstance(raw, str):
                  raise SystemExit(f"{label} path is not a string")
              path = pathlib.Path(raw)
              if not path.is_absolute():
                  raise SystemExit(f"{label} path is not absolute")
              try:
                  relative = path.relative_to(candidate_root)
              except ValueError:
                  raise SystemExit(f"{label} escapes the validated candidate root") from None
              if any(part in ("", ".", "..") for part in relative.parts):
                  raise SystemExit(f"{label} path is not normalized")
              cursor = candidate_root
              for index, part in enumerate(relative.parts):
                  cursor /= part
                  entry = cursor.lstat()
                  if stat.S_ISLNK(entry.st_mode):
                      raise SystemExit(f"{label} traverses a symbolic link")
                  if index + 1 == len(relative.parts):
                      if not stat.S_ISREG(entry.st_mode):
                          raise SystemExit(f"{label} is not a regular file")
                  elif not stat.S_ISDIR(entry.st_mode):
                      raise SystemExit(f"{label} traverses a non-directory")
              if path.resolve(strict=True) != cursor:
                  raise SystemExit(f"{label} resolves outside its lexical candidate path")

          local_packages = [package for package in packages if package.get("source") is None]
          if not local_packages:
              raise SystemExit("Cargo metadata contains no local packages")
          for package in local_packages:
              require_rooted_regular(package.get("manifest_path"), "local package manifest")
              targets = package.get("targets")
              if not isinstance(targets, list) or not targets:
                  raise SystemExit("local package has no Cargo targets")
              for target in targets:
                  if not isinstance(target, dict):
                      raise SystemExit("local package target is not an object")
                  require_rooted_regular(target.get("src_path"), "local package target")
          PY
            if ! jq -e '
              (.packages | type == "array" and length > 0 and length <= 512)
              and all(.packages[];
                ((.source == null) or (.source | type == "string"))
                and (.version | type == "string")
              )
            ' "$metadata" >/dev/null; then
              printf 'release validation failed: cargo metadata has an invalid package inventory\n' >&2
              exit 1
            fi
            versions=$(jq -r \
              '.packages[] | select(.source == null) | .version' "$metadata" \
              | LC_ALL=C sort -u)
            version_count=$(printf '%s\n' "$versions" \
              | awk 'NF { count += 1 } END { print count + 0 }')
            require_eq "workspace local packages must declare exactly one version" "1" "$version_count"
            require_eq "workspace local package version must match release version" \
              "${{ steps.metadata.outputs.version }}" "$versions"
          }
          if [[ "$previous" == BOOTSTRAP ]]; then
            # With no predecessor, first-release policy necessarily trusts the
            # candidate, but confines its Cargo process to the detached tree and
            # an isolated target directory. This path exists only for the
            # project's fixed first public version and cannot be reused if
            # predecessor selection ever regresses.
            require_eq "bootstrap release tag must be v0.0.1" "v0.0.1" "$GITHUB_REF_NAME"
            require_eq "bootstrap release version must be 0.0.1" "0.0.1" "${{ steps.metadata.outputs.version }}"
            if ! jq -e '
              [
                .[][]
                | select(.draft == false and .prerelease == false)
                | select(
                    .tag_name
                    | type == "string"
                      and test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
                  )
              ]
              | length == 0
            ' "$releases" >/dev/null; then
              printf 'release validation failed: bootstrap path requires no prior stable releases\n' >&2
              exit 1
            fi
            (
              cd "$candidate_root"
              CARGO_TARGET_DIR="$RUNNER_TEMP/core-schema-bootstrap-target" \
                cargo +"$RUST_VERSION" run --locked -p iteron-xtask -- \
                  schema-compat check-bootstrap
            )
            validate_cargo_workspace_versions
            git -C "$candidate_root" status \
              --porcelain=v1 -z --untracked-files=all > "$candidate_status"
            require_empty "candidate worktree must be clean after bootstrap validation" "$candidate_status"
            require_eq "candidate worktree HEAD must still match the selected commit" \
              "${{ steps.metadata.outputs.commit }}" \
              "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')"
            require_eq "release checkout HEAD must match the selected commit" \
              "${{ steps.metadata.outputs.commit }}" \
              "$(git rev-parse 'HEAD^{commit}')"
            workspace_status=$RUNNER_TEMP/core-release-workspace-status
            git status --porcelain=v1 -z --untracked-files=all > "$workspace_status"
            require_empty "release checkout must be clean after bootstrap validation" "$workspace_status"
            exit 0
          fi

          require_match "previous release tag must be a strict semantic version" \
            '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' "$previous"
          previous_tag_type=$(git cat-file -t "refs/tags/$previous")
          if [[ "$previous_tag_type" != tag ]]; then
            printf 'release validation failed: previous release refs/tags/%s is a %s tag, but releases require an annotated tag\n' "$previous" "$previous_tag_type" >&2
            exit 1
          fi
          previous_commit=$(git rev-parse "refs/tags/$previous^{commit}")
          require_match "previous release commit must be a 40-character hex SHA" \
            '^[0-9a-f]{40}$' "$previous_commit"
          if ! git merge-base --is-ancestor \
            "$previous_commit" \
            "${{ steps.metadata.outputs.commit }}"; then
            printf 'release validation failed: previous release commit %s must be an ancestor of candidate commit %s\n' \
              "$previous_commit" "${{ steps.metadata.outputs.commit }}" >&2
            exit 1
          fi
          gh release verify "$previous" --repo "$GITHUB_REPOSITORY"

          policy_root=$RUNNER_TEMP/core-schema-policy-base
          git worktree add --detach "$policy_root" "$previous_commit"
          trusted_previous=$(python3 \
            "$policy_root/release-tools/schema_release.py" \
            --input "$releases" \
            --candidate "$GITHUB_REF_NAME")
          require_eq "schema_release.py selected previous release must match policy-computed previous" \
            "$previous" "$trusted_previous"
          validator_root=$policy_root
          if [[ "$previous" == v0.0.4 ]]; then
            # The v0.0.4 validator predates the source-complete ABI inventory and
            # rejects it at its old 128-surface parser ceiling. Use the exact,
            # already-merged compatibility policy that introduced the 160-surface
            # bound and the current parser, only for the v0.0.4 -> v0.0.5 bridge.
            #
            # The pin must name the newest already-merged commit that carries the
            # candidate's exact `xtask/src/schema_compat*` sources, because the
            # equality check below is what makes running this validator instead of
            # the candidate's own an audited substitution rather than a stale one.
            # It therefore moves whenever a merged change touches those sources:
            # d3026afa (#310) widened the binary-target rule so `crates/eval` may
            # declare `iteron-harness` alongside `iteron-eval`, which retired the
            # earlier a9130edb pin.
            require_eq "v0.0.4 bridge release tag must be v0.0.5" "v0.0.5" "$GITHUB_REF_NAME"
            compatibility_commit=d3026afa8258ac29031b8f3007406e2f94aca053
            compatibility_schema_blob=a61c3410a287a937e21714421ef109d91f1f271c
            require_eq "compatibility bridge commit must be a commit object" \
              "commit" "$(git cat-file -t "$compatibility_commit")"
            if ! git merge-base --is-ancestor "$previous_commit" "$compatibility_commit"; then
              printf 'release validation failed: compatibility bridge commit %s must be a descendant of previous release %s\n' \
                "$compatibility_commit" "$previous_commit" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor \
              "$compatibility_commit" \
              "${{ steps.metadata.outputs.commit }}"; then
              printf 'release validation failed: compatibility bridge commit %s must be an ancestor of candidate commit %s\n' \
                "$compatibility_commit" "${{ steps.metadata.outputs.commit }}" >&2
              exit 1
            fi
            require_eq "compatibility bridge governance/schema-compatibility.json blob must match the pinned value" \
              "$compatibility_schema_blob" \
              "$(git rev-parse "$compatibility_commit:governance/schema-compatibility.json")"
            if ! git diff --quiet \
              "$compatibility_commit" \
              "${{ steps.metadata.outputs.commit }}" \
              -- 'xtask/src/schema_compat*'; then
              printf 'release validation failed: xtask/src/schema_compat* sources differ between compatibility bridge commit %s and candidate\n' \
                "$compatibility_commit" >&2
              exit 1
            fi
            validator_root=$RUNNER_TEMP/core-schema-compatibility-policy
            git worktree add --detach "$validator_root" "$compatibility_commit"
          fi
          validator_target=$RUNNER_TEMP/core-schema-validator-target
          (
            cd "$validator_root"
            CARGO_TARGET_DIR="$validator_target" \
              cargo +"$RUST_VERSION" build --locked -p iteron-xtask
          )
          "$validator_target/debug/iteron-xtask" \
            --repo "$candidate_root" \
            schema-compat check-release --base "$previous_commit"
          validate_cargo_workspace_versions
          git -C "$candidate_root" status \
            --porcelain=v1 -z --untracked-files=all > "$candidate_status"
          require_empty "candidate worktree must be clean after schema validation" "$candidate_status"
          require_eq "candidate worktree HEAD must still match the selected commit" \
            "${{ steps.metadata.outputs.commit }}" \
            "$(git -C "$candidate_root" rev-parse 'HEAD^{commit}')"
          require_eq "release checkout HEAD must match the selected commit" \
            "${{ steps.metadata.outputs.commit }}" \
            "$(git rev-parse 'HEAD^{commit}')"
          workspace_status=$RUNNER_TEMP/core-release-workspace-status
          git status --porcelain=v1 -z --untracked-files=all > "$workspace_status"
          require_empty "release checkout must be clean after schema validation" "$workspace_status"
      # Ubuntu 24.04 restricts unprivileged user namespaces unless the invoking program has an
      # explicit AppArmor profile. Attach permission only to the fixed system bwrap path; never
      # disable the host-wide user namespace restriction.
      - name: Install and authorize the bubblewrap boundary
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils bubblewrap
          sudo tee /etc/apparmor.d/core-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile core-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/core-ci-bwrap
      - name: Validate release tooling
        run: release-tools/validate.sh
      - name: Validate ownership and dependency contract
        run: cargo +"$RUST_VERSION" run --locked -p iteron-xtask -- boundaries check

  legal:
    name: release / legal evidence
    needs: validate
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Fetch locked dependency sources
        run: cargo +"$RUST_VERSION" fetch --locked
      - name: Fetch the checksum-pinned cargo-about binary
        run: >-
          python3 release-tools/fetch_tool.py cargo-about linux-arm64
          --output "$RUNNER_TEMP/cargo-about"
      - name: Generate frozen license and notice evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legal"
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --output-file "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            release-tools/about.hbs
          "$RUNNER_TEMP/cargo-about" generate \
            --config release-tools/about.toml \
            --frozen \
            --workspace \
            --fail \
            --format json \
            --output-file "$RUNNER_TEMP/cargo-about.json"
          cargo +"$RUST_VERSION" metadata --locked --format-version 1 \
            > "$RUNNER_TEMP/cargo-metadata.json"
          # Every target the release matrix ships must appear here. A published archive whose
          # NOTICES omit that platform's own crates is a licensing defect, not a cosmetic one, and
          # the Windows leg pulls in windows-sys/winapi-family crates no POSIX target resolves.
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl \
            x86_64-pc-windows-msvc
          do
            cargo +"$RUST_VERSION" tree --locked -p iteron-cli \
              --target "$target" -e normal --prefix none --format '{p}' \
              > "$RUNNER_TEMP/cargo-tree-$target.txt"
          done
          python3 release-tools/legal.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-apple-darwin.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-aarch64-unknown-linux-musl.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-unknown-linux-musl.txt" \
            --dependency-tree "$RUNNER_TEMP/cargo-tree-x86_64-pc-windows-msvc.txt" \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --inventory "$RUNNER_TEMP/cargo-about.json" \
            --output "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html"
          test -s "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: release / ${{ matrix.target }}
    needs: [validate, legal]
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: '["self-hosted","macOS","ARM64","macos-15"]'
            host: darwin-arm64
            target: aarch64-apple-darwin
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
            timeout-minutes: 60
          - runner: '["self-hosted","Linux","ARM64","dgx-release-arm64"]'
            host: linux-arm64
            target: aarch64-unknown-linux-musl
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
            timeout-minutes: 60
          - runner: '["self-hosted","Linux","ARM64","dgx-release-x86"]'
            host: linux-arm64
            target: x86_64-unknown-linux-musl
            python: python3
            tool-suffix: ""
            archive-suffix: tar.gz
            binary: iteron
            timeout-minutes: 60
          # A self-hosted label that no machine answers does not fail: it queues forever, so
          # `build` never completes and `publish` never runs. The company Windows machine is not
          # registered yet, so this leg resolves its labels from a repository variable and falls
          # back to the hosted image. Set WINDOWS_RUNNER_LABELS to a JSON array such as
          # '["self-hosted","Windows","X64","iteron-win"]' once that runner is online; the same
          # variable name gates .github/workflows/windows.yml. Both branches are JSON arrays, so
          # `runs-on` below is unchanged. Windows binaries are `iteron.exe` inside a deterministic
          # `.zip`, which release-tools has always known how to build and verify.
          - runner: ${{ vars.WINDOWS_RUNNER_LABELS || '["windows-2025"]' }}
            host: windows-x86_64
            target: x86_64-pc-windows-msvc
            python: python3
            tool-suffix: .exe
            archive-suffix: zip
            binary: iteron.exe
            timeout-minutes: 120
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/release-build
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-x86_64-static
      CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
      AR_x86_64_unknown_linux_musl: x86_64-linux-musl-ar
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/workspace -C strip=symbols
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Materialize the exact Windows source through the GitHub API
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate.outputs.commit }}
        run: &windows_source_materialization |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$') {
            throw 'unexpected source repository'
          }
          $repositoryParts = $env:SOURCE_REPOSITORY.Split('/')
          if ($repositoryParts.Count -ne 2 -or $repositoryParts -contains '.' -or $repositoryParts -contains '..') {
            throw 'unsafe source repository'
          }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw 'unexpected source commit'
          }

          $maximumArchiveBytes = 268435456
          $maximumMembers = 20000
          $maximumUnpackedBytes = 1073741824
          $materialization = Join-Path $env:RUNNER_TEMP ("iteron-source-$env:SOURCE_SHA")
          if (Test-Path -LiteralPath $materialization) {
            Remove-Item -LiteralPath $materialization -Recurse -Force
          }
          $null = New-Item -ItemType Directory -Path $materialization
          $archivePath = Join-Path $materialization 'source.zip'
          $extractPath = Join-Path $materialization 'extract'
          $null = New-Item -ItemType Directory -Path $extractPath
          $apiUrl = "https://api.github.com/repos/$env:SOURCE_REPOSITORY/zipball/$env:SOURCE_SHA"

          # curl strips Authorization when the API redirects to codeload.github.com unless the
          # unsafe --location-trusted option is present. Never add it: the token belongs only on
          # the initial api.github.com request.
          & curl.exe --proto '=https' --tlsv1.2 --fail --location `
            --retry 6 --retry-all-errors --retry-delay 2 `
            --connect-timeout 20 --max-time 300 --max-filesize $maximumArchiveBytes `
            --header "Accept: application/vnd.github+json" `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --header "X-GitHub-Api-Version: 2026-03-10" `
            --output $archivePath $apiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "source download failed with curl exit code $LASTEXITCODE"
          }
          $archiveBytes = (Get-Item -LiteralPath $archivePath).Length
          if ($archiveBytes -le 0 -or $archiveBytes -gt $maximumArchiveBytes) {
            throw 'source archive is empty or oversized'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destinationRoot = [System.IO.Path]::GetFullPath($extractPath)
          if (-not $destinationRoot.EndsWith([string][System.IO.Path]::DirectorySeparatorChar)) {
            $destinationRoot += [System.IO.Path]::DirectorySeparatorChar
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            if ($zip.Entries.Count -le 0 -or $zip.Entries.Count -gt $maximumMembers) {
              throw 'source archive has an invalid member count'
            }
            $archiveRoot = $null
            $seen = New-Object 'System.Collections.Generic.HashSet[string]' ([System.StringComparer]::OrdinalIgnoreCase)
            [long]$unpackedBytes = 0
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName
              if ([string]::IsNullOrWhiteSpace($name) -or $name.Contains('\') -or
                  $name.Contains(':') -or $name.StartsWith('/') -or
                  [System.IO.Path]::IsPathRooted($name)) {
                throw "unsafe source archive path: $name"
              }
              $segments = $name.TrimEnd('/').Split('/')
              if ($segments.Count -eq 0 -or $segments -contains '' -or
                  $segments -contains '.' -or $segments -contains '..') {
                throw "source archive path escapes its root: $name"
              }
              if ($null -eq $archiveRoot) {
                $archiveRoot = $segments[0]
              } elseif ($segments[0] -cne $archiveRoot) {
                throw 'source archive contains more than one root'
              }
              if (-not $seen.Add($name)) {
                throw "source archive repeats a member: $name"
              }

              $isDirectory = [string]::IsNullOrEmpty($entry.Name)
              if ($isDirectory -ne $name.EndsWith('/')) {
                throw "source archive member type disagrees with its path: $name"
              }
              $fileType = (([int]$entry.ExternalAttributes -shr 16) -band 0xF000)
              if ($fileType -ne 0) {
                $requiredType = if ($isDirectory) { 0x4000 } else { 0x8000 }
                if ($fileType -ne $requiredType) {
                  throw "source archive contains a link or special file: $name"
                }
              }
              if (-not $isDirectory) {
                $unpackedBytes += [long]$entry.Length
                if ($entry.Length -lt 0 -or $unpackedBytes -gt $maximumUnpackedBytes) {
                  throw 'source archive exceeds the unpacked byte limit'
                }
              }

              $relative = $name.Replace('/', [System.IO.Path]::DirectorySeparatorChar)
              $destination = [System.IO.Path]::GetFullPath(
                [System.IO.Path]::Combine($destinationRoot, $relative)
              )
              if (-not $destination.StartsWith($destinationRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "source archive member escapes the destination: $name"
              }
              if ($isDirectory) {
                $null = New-Item -ItemType Directory -Path $destination -Force
              } else {
                $parent = [System.IO.Path]::GetDirectoryName($destination)
                if (-not (Test-Path -LiteralPath $parent -PathType Container)) {
                  $null = New-Item -ItemType Directory -Path $parent -Force
                }
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $false)
              }
            }
          } finally {
            $zip.Dispose()
          }

          $sourceRoot = Join-Path $extractPath $archiveRoot
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot 'Cargo.toml') -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $sourceRoot '.github/workflows/release.yml') -PathType Leaf)) {
            throw 'source archive does not contain the expected Iteron workspace'
          }
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $runnerWorkspace = [System.IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          if (-not $runnerWorkspace.EndsWith([string][System.IO.Path]::DirectorySeparatorChar)) {
            $runnerWorkspace += [System.IO.Path]::DirectorySeparatorChar
          }
          if (-not $workspace.StartsWith($runnerWorkspace, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'GITHUB_WORKSPACE is outside RUNNER_WORKSPACE'
          }
          if (-not (Test-Path -LiteralPath $workspace -PathType Container)) {
            $null = New-Item -ItemType Directory -Path $workspace
          }
          Get-ChildItem -LiteralPath $workspace -Force |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $sourceRoot -Force |
            Move-Item -Destination $workspace -Force
          if (-not (Test-Path -LiteralPath (Join-Path $workspace 'Cargo.toml') -PathType Leaf)) {
            throw 'source materialization did not populate GITHUB_WORKSPACE'
          }
      # `github.workspace` is a backslash path on Windows, so the job-level CARGO_TARGET_DIR and
      # the `--remap-path-prefix` in RUSTFLAGS arrive with separators that link.exe and rustc
      # disagree about. Rewrite both to a mixed `C:/...` form before anything reads them; the
      # remap prefix must still match the real workspace or the reproducibility guarantee silently
      # stops applying. This step is a no-op on every other leg.
      - name: Normalize Windows build paths for native tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(cygpath -m "$GITHUB_WORKSPACE")
          {
            echo "CARGO_TARGET_DIR=$workspace/target/release-build"
            # `/STACK` is repeated here on purpose. It lives in `.cargo/config.toml`, but a
            # `RUSTFLAGS` in the environment replaces `target.*.rustflags` wholesale instead of
            # merging with it, and the line below sets one. Dropping it would publish an
            # `iteron.exe` that overflows its 1 MiB main-thread stack before printing `--version`
            # -- and it would do so only in the release build, which is the worst place to find out.
            echo "RUSTFLAGS=--remap-path-prefix=$workspace=/workspace -C strip=symbols -C link-arg=/STACK:8388608"
          } >> "$GITHUB_ENV"
      - name: Verify pre-provisioned Linux build and sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          command -v bwrap >/dev/null
          command -v musl-gcc >/dev/null
          test -r /etc/apparmor.d/core-ci-bwrap
      - name: Fetch checksum-pinned x86-64 cross-execution tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/x86-cross-tools"
          qemu_root="$tool_root/qemu-user-static"
          package="$tool_root/qemu-user-static.deb"
          zig_archive="$tool_root/zig.tar.xz"
          zig_root="$tool_root/zig-linux-aarch64-0.13.0"
          mkdir -p "$tool_root/bin" "$qemu_root"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz" \
            --output "$zig_archive"
          printf '%s  %s\n' \
            '041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556' \
            "$zig_archive" | sha256sum --check --strict -
          tar --extract --xz --file "$zig_archive" --directory "$tool_root"
          test -x "$zig_root/zig"
          # ports.ubuntu.com dropped this connection mid-release once already
          # (curl 35, SSL_ERROR_SYSCALL), failing a build whose inputs were fine.
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            "https://ports.ubuntu.com/ubuntu-ports/pool/universe/q/qemu/qemu-user-static_8.2.2+ds-0ubuntu1.18_arm64.deb" \
            --output "$package"
          printf '%s  %s\n' \
            '0565144632acc09b92da93e5ef9a2f44fa092797c5b0949744351b184ad948a8' \
            "$package" | sha256sum --check --strict -
          dpkg-deb --extract "$package" "$qemu_root"
          test -x "$qemu_root/usr/bin/qemu-x86_64-static"
          cat > "$tool_root/bin/x86_64-linux-musl-gcc" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          normalized=()
          for argument in "$@"; do
            case "$argument" in
              --target=x86_64-unknown-linux-musl|-lc)
                ;;
              *self-contained*crt*.o)
                ;;
              *)
                normalized+=("$argument")
                ;;
            esac
          done
          exec "$ITERON_ZIG" cc -target x86_64-linux-musl "${normalized[@]}"
          WRAPPER
          cat > "$tool_root/bin/x86_64-linux-musl-ar" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$ITERON_ZIG" ar "$@"
          WRAPPER
          chmod 0755 \
            "$tool_root/bin/x86_64-linux-musl-gcc" \
            "$tool_root/bin/x86_64-linux-musl-ar"
          echo "ITERON_ZIG=$zig_root/zig" >> "$GITHUB_ENV"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
          echo "$qemu_root/usr/bin" >> "$GITHUB_PATH"
      - name: Verify the DGX x86-64 cross-execution boundary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          command -v x86_64-linux-musl-gcc >/dev/null
          command -v x86_64-linux-musl-ar >/dev/null
          command -v qemu-x86_64-static >/dev/null
          x86_64-linux-musl-gcc --version >/dev/null
          x86_64-linux-musl-ar --version >/dev/null
          qemu-x86_64-static --version >/dev/null
      - name: Install the pinned Rust target
        shell: bash
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --target "${{ matrix.target }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-release-legal
          path: ${{ runner.temp }}/legal
      - name: Fetch checksum-pinned build and SBOM tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-bin"
          "${{ matrix.python }}" release-tools/fetch_tool.py cargo-auditable "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/cargo-auditable${{ matrix.tool-suffix }}"
          "${{ matrix.python }}" release-tools/fetch_tool.py syft "${{ matrix.host }}" \
            --output "$RUNNER_TEMP/release-bin/syft${{ matrix.tool-suffix }}"
          echo "$RUNNER_TEMP/release-bin" >> "$GITHUB_PATH"
      # Windows is the only leg whose terminal byte projection is produced by a different console
      # stack, so prove the frozen v4 bytes survive it before anything is packaged. Bounded to one
      # test because this leg has no full-suite step to fall back on.
      - name: Run the bounded Windows one-shot compatibility test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: >-
          cargo +"$RUST_VERSION" test
          --locked -p iteron-cli --bin iteron
          --target "${{ matrix.target }}"
          output::tests::explicit_v4_projection_preserves_the_frozen_terminal_bytes
      # Stamp the build identity INTO the binary. Two artifacts cut from different commits both
      # reported `iteron 0.0.1`, so a user could not tell which one they had and an aged binary had
      # no way to say so. `--version` carries these; `-V` stays the bare semver matched below.
      - name: Build an auditable release binary
        shell: bash
        env:
          ITERON_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          # Derived from SOURCE_DATE_EPOCH, not the wall clock, so the stamp stays reproducible.
          # `date -d @` is GNU-only and this matrix includes macOS; python3 is on every runner.
          ITERON_BUILD_DATE=$(python3 -c 'import os, time; print(time.strftime("%Y-%m-%d", time.gmtime(int(os.environ["SOURCE_DATE_EPOCH"]))))')
          export ITERON_BUILD_DATE
          cargo +"$RUST_VERSION" auditable build \
            --release --locked -p iteron-cli \
            --target "${{ matrix.target }}"
      # `file`, `jq`, and ELF/Mach-O linkage vocabulary do not exist on Windows; the leg below
      # asserts the same properties against a PE image instead.
      - name: Verify architecture, linkage, and executable smoke tests
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          target=${{ matrix.target }}
          test -x "$binary"
          test "$("$binary" -V)" = "iteron ${{ needs.validate.outputs.version }}"
          long_version=$("$binary" --version)
          grep -q "${{ needs.validate.outputs.commit }}" <<<"$long_version"
          grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$long_version"
          "$binary" --help >/dev/null
          "$binary" --machine-contract > "$RUNNER_TEMP/MACHINE-CONTRACT.json"
          jq -e '
            .schema_version == 1
            and .type == "machine_contract"
            and (.cli_stream_versions | index(4)) != null
            and (.default_cli_stream_version | type) == "number"
            and (.resident_protocol_version | type) == "number"
          ' "$RUNNER_TEMP/MACHINE-CONTRACT.json" >/dev/null
          description=$(file "$binary")
          case "$target" in
            aarch64-apple-darwin) grep -q 'arm64' <<<"$description" ;;
            aarch64-unknown-linux-musl) grep -Eq 'ARM aarch64|aarch64' <<<"$description" ;;
            x86_64-unknown-linux-musl) grep -q 'x86-64' <<<"$description" ;;
            *) printf 'unexpected release target %s\n' "$target" >&2; exit 1 ;;
          esac
          if [[ "$target" == *-unknown-linux-musl ]]; then
            grep -Eq 'statically linked|static-pie linked' <<<"$description"
          fi
      # The Windows counterpart of the step above. It must also leave MACHINE-CONTRACT.json in
      # RUNNER_TEMP, because the packaging step copies that file into `dist` as this target's
      # capability report and the release manifest digests it. The child process writes the file
      # directly so its stdout bytes are not reinterpreted by the PowerShell pipeline.
      - name: Verify native Windows PE and schema-v4 capability
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:CARGO_TARGET_DIR '${{ matrix.target }}/release/${{ matrix.binary }}'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "release binary missing at $binary"
          }
          $stream = [System.IO.File]::OpenRead($binary)
          try {
            $reader = New-Object System.IO.BinaryReader($stream)
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'release binary is not a PE image' }
            $stream.Position = 0x3c
            $stream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'release binary has no PE signature' }
            $machine = $reader.ReadUInt16()
            if ($machine -ne 0x8664) {
              throw ('release binary is not an x86-64 PE image (machine 0x{0:x4})' -f $machine)
            }
          } finally {
            $stream.Dispose()
          }
          $shortVersion = (& $binary -V | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "-V exited with $LASTEXITCODE" }
          if ($shortVersion -ne 'iteron ${{ needs.validate.outputs.version }}') {
            throw "release binary reported the wrong version: $shortVersion"
          }
          $longVersion = (& $binary --version | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }
          if ($longVersion -notmatch '${{ needs.validate.outputs.commit }}') {
            throw 'release binary does not carry the release commit'
          }
          if ($longVersion -notmatch '\d{4}-\d{2}-\d{2}') {
            throw 'release binary does not carry a build date'
          }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited with $LASTEXITCODE" }
          $contractPath = Join-Path $env:RUNNER_TEMP 'MACHINE-CONTRACT.json'
          $contractRun = Start-Process -FilePath $binary -ArgumentList '--machine-contract' `
            -RedirectStandardOutput $contractPath -NoNewWindow -Wait -PassThru
          if ($contractRun.ExitCode -ne 0) {
            throw "--machine-contract exited with $($contractRun.ExitCode)"
          }
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          if ($contract.schema_version -ne 1 -or $contract.type -ne 'machine_contract') {
            throw 'release binary returned the wrong capability schema'
          }
          if (-not ($contract.cli_stream_versions -contains 4)) {
            throw 'release binary does not retain CLI stream schema 4'
          }
          foreach ($field in 'default_cli_stream_version', 'resident_protocol_version') {
            $value = $contract.$field
            if ($null -eq $value -or $value -isnot [System.ValueType] -or $value -is [bool]) {
              throw "release binary reported a non-numeric $field"
            }
          }
      - name: Complete one task with the native release client
        id: native-client
        run: >-
          "${{ matrix.python }}" -I release-tools/smoke_release_client.py
          --binary "$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
      - name: Run native version-independence proof
        id: native-version-independence
        if: >-
          success() &&
          (matrix.target == 'x86_64-unknown-linux-musl' ||
          matrix.target == 'x86_64-pc-windows-msvc')
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          # The musl target's test binary — and the server child it spawns — run under
          # qemu-x86_64-static on an aarch64 host. The test's waits are ceilings, not sleeps, so
          # widening them costs a passing run nothing and keeps emulation latency from being
          # reported as a protocol failure. The same ceiling covers Windows process spawn latency.
          ITERON_TEST_TIMEOUT_SCALE: 10
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          max_log_bytes=1048576

          run_exact() {
            label=$1
            shift
            log="$RUNNER_TEMP/core-native-version-$label.log"
            test ! -e "$log"
            set +e
            "$@" 2>&1 | head -c "$((max_log_bytes + 1))" > "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            test "${#pipeline_status[@]}" -eq 2
            status=${pipeline_status[0]}
            capture_status=${pipeline_status[1]}
            test "$capture_status" -eq 0
            bytes=$(wc -c < "$log" | tr -d '[:space:]')
            [[ "$bytes" =~ ^[0-9]+$ ]]
            if [[ "$bytes" -gt "$max_log_bytes" ]]; then
              printf 'native version proof %s exceeded %s bytes\n' \
                "$label" "$max_log_bytes" >&2
              exit 1
            fi
            cat "$log"
            test "$status" -eq 0
            summaries=$(grep -Ec \
              '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in .+$' \
              "$log" || true)
            test "$summaries" -eq 1
          }

          run_exact tui \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli --bin iteron \
              --target "$target" \
              app_server::tests::version_skew_is_refused_up_front -- --exact
          run_exact one-shot \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli \
              --test one_shot_output --target "$target" \
              one_shot_refuses_app_server_version_skew_before_provider_dispatch \
              -- --exact
          run_exact headless \
            cargo +"$RUST_VERSION" test --locked -p iteron-cli \
              --test headless_serve --target "$target" \
              no_tty_skew_reconnect_and_result_v5_share_one_headless_server \
              -- --exact
          # ConPTY is the one terminal takeover path with no POSIX equivalent, so the skew refusal
          # has to be proven on its own console stack rather than inferred from the musl leg.
          if [[ "$target" == x86_64-pc-windows-msvc ]]; then
            run_exact conpty \
              cargo +"$RUST_VERSION" test --locked -p iteron-cli \
                --test windows_conpty --target "$target" \
                native_conpty_rejects_version_skew_before_terminal_takeover \
                -- --exact
          fi
      - name: Generate and normalize the binary SBOM
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          mkdir -p dist
          syft scan "$binary" -o "spdx-json=$RUNNER_TEMP/raw.spdx.json"
          "${{ matrix.python }}" release-tools/sbom.py \
            --input "$RUNNER_TEMP/raw.spdx.json" \
            --binary "$binary" \
            --output "$RUNNER_TEMP/SBOM.spdx.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Package the deterministic release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/release/${{ matrix.binary }}"
          "${{ matrix.python }}" release-tools/manifest.py build-info \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --rustc "$(rustc +"$RUST_VERSION" --version --verbose)" \
            --cargo "$(cargo +"$RUST_VERSION" --version)" \
            --output "$RUNNER_TEMP/BUILD-INFO.json"
          "${{ matrix.python }}" release-tools/package.py \
            --binary "$binary" \
            --license LICENSE \
            --readme README.md \
            --licenses "$RUNNER_TEMP/legal/THIRD_PARTY_LICENSES.html" \
            --notices "$RUNNER_TEMP/legal/THIRD_PARTY_NOTICES.txt" \
            --sbom "$RUNNER_TEMP/SBOM.spdx.json" \
            --build-info "$RUNNER_TEMP/BUILD-INFO.json" \
            --version "${{ needs.validate.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --output-dir dist
          archive_name="iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}"
          cp "$RUNNER_TEMP/SBOM.spdx.json" "dist/$archive_name.spdx.json"
          cp "$RUNNER_TEMP/MACHINE-CONTRACT.json" "dist/$archive_name.machine-contract.json"
          echo "archive=dist/$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive-name=$archive_name" >> "$GITHUB_OUTPUT"
      - name: Generate signed build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
      - name: Generate signed SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ steps.package.outputs.archive }}
          sbom-path: ${{ runner.temp }}/SBOM.spdx.json
      - name: Materialize offline attestation bundles
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          cp "${{ steps.sbom-attestation.outputs.bundle-path }}" \
            "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.provenance.json"
          test -s "dist/${{ steps.package.outputs.archive-name }}.sbom-attestation.json"
      # `render_installer.py` syntax-checks a `.ps1` with the PowerShell parser, and this is the
      # only job in the workflow that has PowerShell — `publish` runs on Linux. Render here so the
      # dependency stays where the interpreter is; `publish` only collects the resulting artifact
      # and signs it alongside `install.sh`.
      - name: Render and syntax-check the Windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.python }}" release-tools/render_installer.py \
            --template install.ps1 \
            --version "${{ needs.validate.outputs.version }}" \
            --output "$RUNNER_TEMP/windows-installer/install.ps1"
          test -s "$RUNNER_TEMP/windows-installer/install.ps1"
      - name: Upload the rendered Windows installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-windows-installer
          path: ${{ runner.temp }}/windows-installer/install.ps1
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-release-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.archive-name }}*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: release / publish immutable assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, legal, build]
    runs-on: [self-hosted, Linux, ARM64, dgx]
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # The Actions token cannot read the administration-only immutable-releases endpoint.
      # Owner approval on this environment and this externally audited repository variable are
      # both required before any release mutation. Publishing still fails unless the ordinary
      # release API reports the resulting release as immutable.
      - name: Require the externally audited immutable-release control
        env:
          RELEASE_IMMUTABLE_CONFIRMED: ${{ vars.RELEASE_IMMUTABLE_CONFIRMED }}
        run: test "$RELEASE_IMMUTABLE_CONFIRMED" = true
      # This job asserts the published release is immutable with `gh release verify`, so it needs
      # the same pinned CLI `validate` installs. Without it the job inherits whichever gh the
      # picked `dgx` runner happens to carry, and an older one has no `verify` subcommand at all:
      # v0.0.5 published correctly and then failed here on a usage dump.
      - name: Install the pinned GitHub CLI with release verification support
        shell: bash
        run: |
          set -euo pipefail
          tool_root=$(mktemp -d "$RUNNER_TEMP/iteron-gh-cli.XXXXXX")
          archive=$tool_root/gh.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_arm64.tar.gz"
          printf '%s  %s\n' "$GH_CLI_LINUX_ARM64_SHA256" "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$tool_root"
          gh_root=$tool_root/gh_${GH_CLI_VERSION}_linux_arm64
          test -x "$gh_root/bin/gh"
          "$gh_root/bin/gh" release verify --help >/dev/null
          echo "$gh_root/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: core-release-*
          path: dist
          merge-multiple: true
      - name: Render release metadata
        run: |
          set -euo pipefail
          # `install.ps1` is rendered and syntax-checked on the Windows build leg, because this
          # runner has no PowerShell parser. It arrives here through the
          # core-release-windows-installer artifact; fail before any release mutation if it did
          # not, rather than publishing a release whose Windows installer is missing.
          test -s dist/install.ps1
          python3 release-tools/render_installer.py \
            --template install.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --output dist/install.sh
          python3 release-tools/manifest.py release \
            --version "${{ needs.validate.outputs.version }}" \
            --commit "${{ needs.validate.outputs.commit }}" \
            --dist dist \
            --target aarch64-apple-darwin \
            --target aarch64-unknown-linux-musl \
            --target x86_64-unknown-linux-musl \
            --target x86_64-pc-windows-msvc \
            --protocol-source crates/protocol/src/wire.rs \
            --output dist/release-manifest.json \
            --receipt dist/release-manifest.receipt.json
          python3 release-tools/checksums.py \
            --dist dist \
            --output dist/SHA256SUMS
          # The manifest's installer field is now a strict POSIX+Windows pair. Verify both exact
          # bytes before signing or mutating the release so one platform cannot silently ship an
          # installer that the public manifest does not bind.
          python3 release-tools/verify_release.py installers \
            --manifest dist/release-manifest.json \
            --receipt dist/release-manifest.receipt.json \
            --posix dist/install.sh \
            --windows dist/install.ps1
      - name: Sign release metadata
        id: metadata-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/install.sh
            ${{ github.workspace }}/dist/install.ps1
            ${{ github.workspace }}/dist/release-manifest.json
            ${{ github.workspace }}/dist/release-manifest.receipt.json
            ${{ github.workspace }}/dist/SHA256SUMS
      - name: Materialize metadata attestation bundle
        shell: bash
        run: >-
          cp "${{ steps.metadata-attestation.outputs.bundle-path }}"
          dist/release-metadata.provenance.json
      - name: Publish the complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_version=2026-03-10
          created_release_id=
          published=false
          cleanup_workflow_draft() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 && "$published" != true \
              && "$created_release_id" =~ ^[0-9]+$ ]]; then
              set +e
              cleanup_json=$(gh api \
                -H "X-GitHub-Api-Version: $api_version" \
                "repos/$GITHUB_REPOSITORY/releases/$created_release_id" 2>/dev/null)
              if [[ "$(jq -r '.id // empty' <<<"$cleanup_json")" = "$created_release_id" \
                && "$(jq -r '.tag_name // empty' <<<"$cleanup_json")" = "$GITHUB_REF_NAME" \
                && "$(jq -r '.draft // empty' <<<"$cleanup_json")" = true ]]; then
                gh api --method DELETE \
                  -H "X-GitHub-Api-Version: $api_version" \
                  "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
                printf 'removed workflow-owned failed draft release id %s\n' \
                  "$created_release_id" >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup_workflow_draft EXIT

          expected_commit=${{ needs.validate.outputs.commit }}
          [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]
          remote_tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_REF" = "$remote_tag_ref"
          verify_remote_annotated_tag() {
            stage=$1
            [[ "$stage" =~ ^[a-z-]+$ ]]
            verification_ref="refs/core-release-verification/$stage"
            git fetch --force --no-tags origin \
              "$remote_tag_ref:$verification_ref"
            test "$(git cat-file -t "$verification_ref")" = tag
            remote_commit=$(git rev-parse "$verification_ref^{commit}")
            test "$remote_commit" = "$expected_commit"
          }

          # Re-read the remote ref immediately before the first release mutation.
          # Repository tag protection remains the external atomicity boundary.
          verify_remote_annotated_tag pre-create

          existing_release_ids=$(gh api --paginate \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          if [[ -n "$existing_release_ids" ]]; then
            printf 'release already exists; refusing to replace a published or draft release\n' >&2
            exit 1
          fi

          release_json=$RUNNER_TEMP/release.json
          gh api --method POST \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Iteron ${{ needs.validate.outputs.version }}" \
            -F draft=true \
            -F generate_release_notes=true > "$release_json"
          created_release_id=$(jq -r '.id // empty' "$release_json")
          [[ "$created_release_id" =~ ^[0-9]+$ ]]
          printf 'created workflow-owned draft release id %s\n' "$created_release_id"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

          verified=false
          for _ in $(seq 1 12); do
            gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" > "$release_json"
            test "$(jq -r .id "$release_json")" = "$created_release_id"
            local_count=$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')
            remote_count=$(jq '.assets | length' "$release_json")
            if [[ "$local_count" != "$remote_count" ]]; then
              sleep 2
              continue
            fi
            verified=true
            while IFS= read -r asset; do
              name=${asset##*/}
              expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
              actual=$(jq -r --arg name "$name" \
                '[.assets[] | select(.name == $name) | .digest] | if length == 1 then .[0] else "" end' \
                "$release_json")
              if [[ "$actual" != "$expected" ]]; then
                verified=false
                break
              fi
            done < <(find dist -maxdepth 1 -type f | LC_ALL=C sort)
            [[ "$verified" == true ]] && break
            sleep 2
          done
          [[ "$verified" == true ]]

          # Uploading a draft can take minutes. Refuse publication if the remote
          # annotated tag disappeared or moved during that window.
          verify_remote_annotated_tag pre-publish
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: $api_version" \
            "repos/$GITHUB_REPOSITORY/releases/$created_release_id" \
            -F draft=false \
            -f make_latest=true > "$release_json"
          test "$(jq -r .id "$release_json")" = "$created_release_id"
          test "$(jq -r .draft "$release_json")" = false
          published=true

          immutable_release=false
          for _ in $(seq 1 6); do
            immutable_release=$(gh api \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" --jq .immutable)
            [[ "$immutable_release" == true ]] && break
            sleep 2
          done
          if [[ "$immutable_release" != true ]]; then
            printf 'release id %s is mutable; deleting only this workflow-created release\n' \
              "$created_release_id" >&2
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: $api_version" \
              "repos/$GITHUB_REPOSITORY/releases/$created_release_id" >/dev/null
            printf 'deleted workflow-created mutable release id %s; tag was preserved\n' \
              "$created_release_id" >&2
            exit 1
          fi

          release_verified=false
          for _ in $(seq 1 12); do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              release_verified=true
              break
            fi
            sleep 5
          done
          [[ "$release_verified" == true ]]

          # Every published archive must be covered here. The Windows leg ships `.zip`, so a
          # tar.gz-only glob would have attested nothing for it and still reported success.
          # Counting the loop against the manifest's target list means a future archive suffix
          # cannot reintroduce that silent gap: it fails the release instead of skipping it.
          shopt -s nullglob
          expected_archives=$(jq '.targets | length' dist/release-manifest.json)
          [[ "$expected_archives" =~ ^[1-9][0-9]*$ ]]
          verified_archives=0
          for archive in dist/iteron-v*.tar.gz dist/iteron-v*.zip; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --predicate-type https://spdx.dev/Document/v2.3
            verified_archives=$((verified_archives + 1))
          done
          test "$verified_archives" -eq "$expected_archives"

  content-canary:
    name: release / content canary / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: '["self-hosted","macOS","ARM64","macos-15"]'
            target: aarch64-apple-darwin
            archive-suffix: tar.gz
            python: python3
          - runner: '["self-hosted","Linux","ARM64","dgx-release-arm64"]'
            target: aarch64-unknown-linux-musl
            archive-suffix: tar.gz
            python: python3
          - runner: '["self-hosted","Linux","ARM64","dgx-release-x86"]'
            target: x86_64-unknown-linux-musl
            archive-suffix: tar.gz
            python: python3
          # Same anti-queue reasoning as the build matrix: resolve the labels from
          # WINDOWS_RUNNER_LABELS and fall back to the hosted image, so an unregistered
          # self-hosted label can never leave a published release un-canaried.
          - runner: ${{ vars.WINDOWS_RUNNER_LABELS || '["windows-2025"]' }}
            target: x86_64-pc-windows-msvc
            archive-suffix: zip
            python: python3
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Materialize the exact Windows source through the GitHub API
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate.outputs.commit }}
        run: *windows_source_materialization
      - name: Download, content-verify, extract, and smoke the exact artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          canary="$RUNNER_TEMP/core-content-canary"
          mkdir -p "$canary/download" "$canary/extract"
          archive="iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}"
          report="$archive.machine-contract.json"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern install.sh \
            --pattern install.ps1 \
            --pattern release-manifest.json \
            --pattern release-manifest.receipt.json \
            --pattern "$archive" \
            --pattern "$report" \
            --dir "$canary/download"
          if [[ "${{ matrix.target }}" == x86_64-pc-windows-msvc ]]; then
            "${{ matrix.python }}" release-tools/verify_release.py installers \
              --manifest "$canary/download/release-manifest.json" \
              --receipt "$canary/download/release-manifest.receipt.json" \
              --posix "$canary/download/install.sh" \
              --windows "$canary/download/install.ps1"
          fi
          binary=$("${{ matrix.python }}" release-tools/verify_release.py artifact \
            --manifest "$canary/download/release-manifest.json" \
            --receipt "$canary/download/release-manifest.receipt.json" \
            --archive "$canary/download/$archive" \
            --capability-report "$canary/download/$report" \
            --target "${{ matrix.target }}" \
            --extract-dir "$canary/extract")
          # `-V` is the bare `iteron <version>` line. `--version` deliberately appends the commit
          # and build date, so asserting equality against it can never hold.
          test "$("$binary" -V)" = "iteron ${{ needs.validate.outputs.version }}"
          "$binary" --machine-contract > "$canary/live-machine-contract.json"
          "${{ matrix.python }}" release-tools/verify_release.py contract \
            --manifest "$canary/download/release-manifest.json" \
            --report "$canary/live-machine-contract.json"
      # `install.sh` is a POSIX installer, so the curl canary below cannot cover Windows. This is
      # the only proof that `releases/latest/download/<archive>` resolves to the same bytes the
      # tag published, which is the URL a Windows user actually fetches.
      - name: Verify the latest Windows archive redirect
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'iteron-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive-suffix }}'
          $exactArchive = Join-Path $env:RUNNER_TEMP "core-content-canary/download/$archiveName"
          if (-not (Test-Path -LiteralPath $exactArchive -PathType Leaf)) {
            throw "content-verified Windows archive missing at $exactArchive"
          }
          $latestArchive = Join-Path $env:RUNNER_TEMP 'iteron-latest.zip'
          curl.exe --proto '=https' --tlsv1.2 -LsSf --retry 6 --retry-all-errors `
            --retry-delay 2 `
            "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$archiveName" `
            -o $latestArchive
          if ($LASTEXITCODE -ne 0) {
            throw "latest Windows archive download exited with $LASTEXITCODE"
          }
          $latestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $latestArchive).Hash
          $exactHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exactArchive).Hash
          if ($latestHash -ne $exactHash) {
            throw 'latest Windows archive does not match the content-verified tag archive'
          }
      # Exercise the public copy-paste path, not only the checked-in template. Snapshot and restore
      # the runner account's PATH registry value because this job may run on persistent company
      # hardware; a canary must leave no stale temp directory in a long-lived user PATH.
      - name: Install through the one-click Windows command
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $processPath = $env:PATH
          $environmentKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $hadUserPath = $false
          $rawUserPath = $null
          $userPathKind = $null
          if ($null -ne $environmentKey -and ($environmentKey.GetValueNames() -contains 'Path')) {
            $hadUserPath = $true
            $rawUserPath = [string]$environmentKey.GetValue(
              'Path',
              '',
              [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames
            )
            $userPathKind = $environmentKey.GetValueKind('Path')
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'iteron-one-click'
          try {
            $env:ITERON_INSTALL_DIR = $installRoot
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
            Invoke-RestMethod -Uri (
              "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1"
            ) | Invoke-Expression
            $binary = Join-Path $installRoot 'iteron.exe'
            $reported = & $binary -V
            if ($LASTEXITCODE -ne 0 -or $reported -ne 'iteron ${{ needs.validate.outputs.version }}') {
              throw 'the one-click Windows install did not produce the expected Iteron version'
            }
          } finally {
            Remove-Item Env:ITERON_INSTALL_DIR -ErrorAction SilentlyContinue
            $env:PATH = $processPath
            if ($null -ne $environmentKey) {
              if ($hadUserPath) {
                $environmentKey.SetValue('Path', $rawUserPath, $userPathKind)
              } else {
                $environmentKey.DeleteValue('Path', $false)
              }
              $environmentKey.Dispose()
            }
            Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

  curl-canary:
    name: release / curl canary / ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, publish]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: '["self-hosted","macOS","ARM64","macos-15"]'
            target: aarch64-apple-darwin
          - runner: '["self-hosted","Linux","ARM64","dgx-release-arm64"]'
            target: aarch64-unknown-linux-musl
          - runner: '["self-hosted","Linux","ARM64","dgx-release-x86"]'
            target: x86_64-unknown-linux-musl
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the exact public release through curl
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/iteron-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" \
            | sh -s -- --version "$GITHUB_REF_NAME" --bin-dir "$bin_dir"
          test "$("$bin_dir/iteron" -V)" = "iteron ${{ needs.validate.outputs.version }}"
      - name: Verify the latest installer redirect
        shell: bash
        run: |
          set -euo pipefail
          bin_dir=$RUNNER_TEMP/iteron-latest-bin
          curl --proto '=https' --tlsv1.2 -LsSf \
            --retry 6 --retry-all-errors --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" \
            | sh -s -- --bin-dir "$bin_dir"
          test "$("$bin_dir/iteron" -V)" = "iteron ${{ needs.validate.outputs.version }}"
