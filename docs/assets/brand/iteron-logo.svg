<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" role="img" aria-labelledby="title description">
  <title id="title">Iteron ASCII wordmark</title>
  <desc id="description">ITERON drawn as terminal ASCII art in a restrained open-source project wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#0d1724"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79f2c0"/>
      <stop offset="0.52" stop-color="#6ea8fe"/>
      <stop offset="1" stop-color="#b99cff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9fb0c3" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1178" height="318" rx="28" fill="url(#panel)" stroke="#26384a" stroke-width="2"/>
  <rect x="18" y="18" width="1144" height="284" rx="18" fill="url(#grid)" stroke="#31465b" stroke-width="1"/>
  <circle cx="46" cy="43" r="5" fill="#ff7a90"/>
  <circle cx="65" cy="43" r="5" fill="#ffd166"/>
  <circle cx="84" cy="43" r="5" fill="#79f2c0"/>
  <g fill="#e8f0f7" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="34" font-weight="700" xml:space="preserve">
    <text x="170" y="92"> ___ _____ _____ ____   ___  _   _</text>
    <text x="170" y="130">|_ _|_   _| ____|  _ \ / _ \| \ | |</text>
    <text x="170" y="168"> | |  | | |  _| | |_) | | | |  \| |</text>
    <text x="170" y="206"> | |  | | | |___|  _ &lt;| |_| | |\  |</text>
    <text x="170" y="244">|___| |_| |_____|_| \_\\___/|_| \_|</text>
  </g>
  <path d="M170 269H1010" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <text x="590" y="293" text-anchor="middle" fill="#9fb0c3" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" letter-spacing="2.1">OPEN SOURCE · TERMINAL NATIVE · RUST</text>
</svg>
