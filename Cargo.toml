# Iteron — a coding agent, and the controller architecture underneath it.
# One crate per module (ADR-010). The iteron speaks an id-correlated submission/event
# protocol in-process; the CLI is the first thin frontend adapter.
[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/changeset",
    "crates/marketplace",
    "crates/statusline",
    "crates/support",
    "crates/protocol",
    "crates/record",
    "crates/obs",
    "crates/provider",
    "crates/tools",
    "crates/sandbox",
    "crates/ctx",
    "crates/verify",
    "crates/lsp",
    "crates/mcp",
    "crates/sched",
    "crates/workflow",
    "crates/agents",
    "crates/kernel",
    "crates/cli",
    "crates/eval",
    "crates/evolve",
    "crates/tunables",
]

[workspace.package]
version = "0.0.9"
edition = "2024"
license = "Apache-2.0"
publish = false
authors = ["Jamal Cao and Iteron contributors"]
repository = "https://github.com/Plantcore-AI/Iteron"
homepage = "https://plantcore-ai.github.io/Iteron/"
rust-version = "1.90"

# Dependencies are admitted only at the standard-protocol layer (JSON, HTTP to the
# model provider, hashing) or as the async runtime the flagship mandates (ADR-004/010).
# No agent framework. The runtime owns its control and safety boundaries directly.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
hex = "0.4"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
ignore = "0.4"
regex = "1"
# Terminal UI: the de-facto standard Rust stack (same as Codex), admitted at the standard-UI layer.
ratatui = "0.30.2"
crossterm = "0.29"
getrandom = "0.4"
ring = "0.17"
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
# Raster decoders are admitted only for bounded frontend validation. Keep encoder,
# SIMD, and unrelated image-processing features out of the CLI dependency graph.
png = { version = "0.18", default-features = false }
gif = { version = "0.14", default-features = false, features = ["std"] }
image-webp = { version = "0.2", default-features = false }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
